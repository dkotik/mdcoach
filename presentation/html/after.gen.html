// ============== debounce.js =====================

function debounce(callback, delay = 0) {
  let timeoutId;

  return function (...args) {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
      timeoutId = undefined;
      callback.apply(this, args);
    }, Math.max(10, delay));
  };
}
const scrollToVisibleSlide = debounce((event) => {
  if (document.body.classList.contains('slides')) {
    if (window.scrollY !== 0) {
      window.scrollTo(0, 0)
    }
    return
  }

  const slideIndex = event.detail?.slideIndex
  if (!Number.isInteger(slideIndex)) {
    return
  }

  const slide = document.getElementById(`slide-${slideIndex + 1}`)
  if (!slide) {
    return
  }

  const bounds = slide.getBoundingClientRect()
  const isVisible = bounds.top >= 0 &&
    bounds.left >= 0 &&
    bounds.bottom <= window.innerHeight &&
    bounds.right <= window.innerWidth
  if (isVisible) {
    return
  }

  slide.style.scrollMargin = '1rem'
  slide.scrollIntoView({ behavior: 'smooth' })
}, 120)

window.addEventListener(navigationCompleteEventType, scrollToVisibleSlide)
// ============== input.js =====================
const nextEventType = "nextListItemOrSlide"
const next = (event) => {
  event.preventDefault()
  window.dispatchEvent(new CustomEvent(nextEventType, {
    bubbles: true,
    cancelable: true,
    detail: event
  }))
}

const previousEventType = "previousSlide"
const previous = (event) => {
  event.preventDefault()
  window.dispatchEvent(new CustomEvent(previousEventType, {
    bubbles: true,
    cancelable: true,
    detail: event
  }))
}

document.addEventListener(
  'keydown',
  (event) => {
    const isEditing = event.composedPath().some((target) =>
      target instanceof HTMLElement && (
        target.matches('input, textarea, select') || target.isContentEditable
      )
    )
    if (isEditing || document.querySelector('presentation-curtain')?.IsDown()) {
      return
    }

    switch (event.code) {
      case 'ArrowRight':
      case 'ArrowDown':
      case 'PageDown':
      case 'Space':
      case 'KeyJ':
        next(event)
        return
      case 'ArrowLeft':
      case 'ArrowUp':
      case 'PageUp':
      case 'Backspace':
      case 'KeyK':
        previous(event)
        return
      case 'KeyN':
        document.querySelector('slide-notes-toggle')?.click()
        return
      case 'KeyC':
        window.open(window.location.href, '_blank')
        return
      case 'KeyR':
        synchronizer.broadcastWindowState(true)
        window.location.reload()
        return
    }
  }
)

document.getElementById("slideJump").addEventListener(
  keyStrokeCompleteEventType,
  (event) => {
    const requestedSlide = Number.parseInt(event.detail.replace(/\s+/g, ''), 10)
    if (!Number.isInteger(requestedSlide)) {
      return
    }

    const slideNumber = Math.min(
      Math.max(requestedSlide, 1),
      finalSlideIndex + 1,
    )
    navigate(slideNumber - 1)
    concealedListItems = getCurrentConcealedListItems()
    dispatchNavigationCompleteEvent(concealedListItems.length)
  }
)
// ============== slides.js =====================

let currentSlide = 0
let currentListItem = 0

const focusedClass = "is-focused"
const reverseClass = "reverse"
const slides = document.querySelectorAll('main > section')
const finalSlideIndex = slides.length - 1
slides[currentSlide].classList.add(focusedClass)
slides[currentSlide].classList.add(reverseClass)


const getCurrentConcealedListItems = () => {
  return slides[currentSlide].querySelectorAll(":scope > .grid > .content > ul > li:not(.is-revealed)")
}

const navigate = (targetSlide) => {
  const isForward = targetSlide > currentSlide

  let currentSlideClassList = slides[currentSlide].classList
  currentSlideClassList.remove(focusedClass)
  if (isForward) {
    currentSlideClassList.add(reverseClass)
  } else {
    currentSlideClassList.remove(reverseClass)
  }
  currentSlide = targetSlide

  currentSlideClassList = slides[currentSlide].classList
  currentSlideClassList.add(focusedClass)
  if (isForward) {
    currentSlideClassList.remove(reverseClass)
  } else {
    currentSlideClassList.add(reverseClass)
  }

  const title = document.title.replace(/^\d+\/\d+\s*/, '')
  document.title = `${currentSlide + 1}/${finalSlideIndex + 1} ${title}`
  window.history.replaceState(null, null, '#' + (currentSlide + 1))
}
const dispatchNavigationCompleteEvent = (concealedListItemCount) => {
  window.dispatchEvent(
    new CustomEvent(
      navigationCompleteEventType,
      {
        detail: {
          slideIndex: currentSlide,
          finalSlideIndex: finalSlideIndex,
          concealedListItemCount: concealedListItemCount
        }
    })
  )
}

let flashTimeout
const flashBody = () => {
  const body = document.body
  if (body.classList.contains('is-flashing')) {
    window.clearTimeout(flashTimeout)
    flashTimeout = window.setTimeout(() => {
      body.classList.remove('is-flashing')
    }, 300)
    return
  }

  body.classList.add('is-flashing')
  flashTimeout = window.setTimeout(() => {
    body.classList.remove('is-flashing')
  }, 300)
}

window.addEventListener(nextEventType, (event) => {
  if (currentSlide >= finalSlideIndex) {
    flashBody()
    return
  }
  let concealedListItems = getCurrentConcealedListItems()
  for (const element of concealedListItems) {
    element.classList.add("is-revealed")
    debounce(dispatchNavigationCompleteEvent, 100)(
      concealedListItems.length-1
    )
    return
  }
  navigate(currentSlide + 1)
  concealedListItems = getCurrentConcealedListItems()
  debounce(dispatchNavigationCompleteEvent, 100)(
    concealedListItems.length
  )
})

window.addEventListener(previousEventType, (event) => {
  if (currentSlide === 0) {
    flashBody()
    return
  }
  navigate(currentSlide - 1)
  const concealedListItems = getCurrentConcealedListItems()
  debounce(dispatchNavigationCompleteEvent, 100)(
    concealedListItems.length
  )
})

const getSlideIndexFromLocationHash = () => {
  const rawHash = window.location.hash.substring(1);

  // Parse the string into a numeric value
  let numericValue = parseInt(rawHash, 10);

  // Check if it is a valid number
  if (isNaN(numericValue)) {
    return 0
  }
  numericValue--
  if (numericValue < 0) {
    return 0
  }
  if (numericValue > finalSlideIndex) {
    return finalSlideIndex
  }
  return numericValue
}

const navigateToWindowHashLocation = () => {
  const slideIndex = getSlideIndexFromLocationHash()
  if (slideIndex === currentSlide) {
    return
  }
  navigate(slideIndex)
  const concealedListItems = getCurrentConcealedListItems()
  debounce(dispatchNavigationCompleteEvent, 100)(
    concealedListItems.length
  )
}
window.addEventListener(
  "hashchange",
  navigateToWindowHashLocation
)

navigateToWindowHashLocation()

function scaleElementDown(element) {
  const attribute = element.getAttribute("data-scale")
  const current = Number.parseInt(attribute ?? "100", 10)
  if (current < 20) {
    return false
  }
  element.setAttribute("data-scale", String(current - 10))
  return true
}

let topEdge = 20
function isTooLarge(element) {
  return (element.getBoundingClientRect().height + topEdge) > window.innerHeight
}

function scaleDown() {
  let scaling = false
  for (const slide of slides) {
    const element = slide.querySelector(":scope > .grid > .content")
    if (isTooLarge(element)) {
      scaling = scaleElementDown(element)
    }
  }

  if (scaling) {
    window.setTimeout(scaleDown, 150)
  }
}

window.setTimeout(() => {
  // topEdge = slides[0]?.getBoundingClientRect().top ?? 20
  // console.log("topEdge", topEdge)
  topEdge = parseFloat(window.getComputedStyle(slides[0].querySelector(":scope > .grid")).paddingTop)
  scaleDown()
}, 150)

window.addEventListener("resize", debounce(() => {
  for (const slide of slides) {
    const element = slide.querySelector(":scope > .grid > .content")
    element.setAttribute("data-scale", "100")
  }
  window.setTimeout(scaleDown, 150)
}, 200))

// ============== synchronize.js =====================

class WindowState {
  DocumentID
  WindowID
  SlideIndex
  ConcealedListItemCount
  TimerElapsedDuration
  TimerUtmostDuration
  IsTimerRunning
  IsCurtainDown
  IsReloading
}

class Synchronizer {
  DocumentID
  WindowID
  Curtain
  MainTimer
  Channel
  IsWindowFocused

  constructor() {
    this.DocumentID = document.querySelector("html").dataset.id ||
      "random"+Math.random().toString(36) + Date.now().toString(36)
    this.WindowID = Math.random().toString(36) + '|' + Date.now()
    this.Curtain = document.querySelector('presentation-curtain')
    this.MainTimer = document.querySelector('presentation-timer#mainTimer')
    this.Channel = new BroadcastChannel(this.DocumentID)

    this.debouncedBroadcastWindowState = debounce(this.broadcastWindowState.bind(this), 120)
    this.onNavigationComplete = this.onNavigationComplete.bind(this)
    this.onStateChange = this.onStateChange.bind(this)
    this.onFocus = this.onFocus.bind(this)
    this.onBlur = this.onBlur.bind(this)
    this.onMessage = this.onMessage.bind(this)

    this.setWindowFocused(document.hasFocus())
    window.addEventListener(navigationCompleteEventType, this.onNavigationComplete)
    this.Curtain?.addEventListener('change', this.onStateChange)
    this.MainTimer?.addEventListener('change', this.onStateChange)
    window.addEventListener('focus', this.onFocus)
    window.addEventListener('blur', this.onBlur)
    this.Channel.addEventListener('message', this.onMessage)
    this.broadcastWindowState()
  }


  setMainTimerState(state) {
    const duration = Number(state?.TimerUtmostDuration)
    const elapsed = Number(state?.TimerElapsedDuration)
    const timer = this.MainTimer

    timer.setDuration(elapsed, duration)
    const running = state.IsTimerRunning
    if (running) {
      timer.start()
    } else {
      timer.pause()
    }
  }

  setMainCurtainState(state) {
    if (
      this.Curtain && typeof state?.IsCurtainDown === 'boolean' &&
      this.Curtain.IsDown() !== state.IsCurtainDown
    ) {
      if (state.IsCurtainDown) {
        this.Curtain.Down()
      } else {
        this.Curtain.Up()
      }
    }
  }

  broadcastWindowState(reloading = false) {
    if (this.IsWindowFocused !== true) {
      return
    }

    const state = new WindowState()
    state.DocumentID = this.DocumentID
    state.WindowID = this.WindowID
    state.SlideIndex = currentSlide
    state.ConcealedListItemCount = getCurrentConcealedListItems().length
    state.IsCurtainDown = Boolean(this.Curtain?.IsDown())
    state.IsReloading = reloading === true

    const timer = this.MainTimer
    const elapsed = Number(timer?.ElapsedDuration)
    const duration = Number(timer?.UtmostDuration)
    state.TimerElapsedDuration = elapsed
    state.TimerUtmostDuration = duration
    state.IsTimerRunning = timer.IsRunning
    this.Channel.postMessage(state)
    // console.debug("bout", state.IsTimerRunning)
  }

  setWindowFocused(focused) {
    this.IsWindowFocused = focused
    document.body.classList.toggle('is-focused', focused)
  }

  onNavigationComplete() {
    this.debouncedBroadcastWindowState()
  }

  onStateChange(event) {
    this.broadcastWindowState()
  }

  onFocus() {
    this.setWindowFocused(true)
    // this.debouncedBroadcastWindowState()
  }

  onBlur() {
    this.setWindowFocused(false)
    this.debouncedBroadcastWindowState()
  }

  onMessage(event) {
    const broadcast = event.data
    // console.debug("bin", broadcast.IsTimerRunning)
    this.setWindowFocused(false)
    this.setMainCurtainState(broadcast)
    this.setMainTimerState(broadcast)
    if (broadcast.DocumentID !== this.DocumentID) {
      return
    }
    if (broadcast.IsReloading === true) {
      window.location.reload()
      return
    }


    if (broadcast.SlideIndex !== currentSlide) {
      navigate(broadcast.SlideIndex)
    }
    const concealedListItems = getCurrentConcealedListItems()
    let revealCount = concealedListItems.length - broadcast.ConcealedListItemCount
    for (const element of concealedListItems) {
      if (revealCount === 0) {
        return
      }
      element.classList.add("is-revealed")
      revealCount--
    }
  }
}

const synchronizer = new Synchronizer()
