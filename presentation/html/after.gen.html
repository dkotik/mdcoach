// ============== debounce.js =====================

function debounce(callback, delay = 0) {
  let timeoutId;

  return function (...args) {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
      timeoutId = undefined;
      callback.apply(this, args);
    }, Math.max(0, delay));
  };
}
// ============== input.js =====================

const nextEventType = "nextListItemOrSlide"
const next = (event) => {
  event.preventDefault()
  window.dispatchEvent(new CustomEvent(nextEventType, {
    bubbles: true,
    cancelable: true,
    detail: event
  }))
}

const previousEventType = "previousSlide"
const previous = (event) => {
  event.preventDefault()
  window.dispatchEvent(new CustomEvent(previousEventType, {
    bubbles: true,
    cancelable: true,
    detail: event
  }))
}

document.addEventListener(
  'keydown',
  (event) => {
    switch (event.code) {
      case 'ArrowRight':
      case 'ArrowDown':
      case 'PageDown':
      case 'Space':
      case 'KeyJ':
        next(event)
        return
      case 'ArrowLeft':
      case 'ArrowUp':
      case 'PageUp':
      case 'Backspace':
      case 'KeyK':
        previous(event)
        return
      case 'KeyC':
        window.open(window.location.href, '_blank')
        return
    }
  }
)

document.addEventListener(
  'wheel',
  (event) => {
    if (event.deltaY >= 0) {
      next(event)
    } else {
      previous(event)
    }
  }
)
// ============== focus.js =====================

let currentSlide = 0
let currentListItem = 0

const focusedClass = "is-focused"
const reverseClass = "reverse"
const slides = document.querySelectorAll('main > section')
const finalSlideIndex = slides.length-1

const navigate = (isForward) => {
  for (const element of slides[currentSlide].querySelectorAll(":scope > ul > li:not(.is-revealed)")) {
    element.classList.add("is-revealed")
    return
  }

  slides[currentSlide].classList.remove(focusedClass)
  if (isForward) {
    slides[currentSlide].classList.add(reverseClass)
    currentSlide++
  } else {
    slides[currentSlide].classList.remove(reverseClass)
    currentSlide--
  }
  slides[currentSlide].classList.add(focusedClass)
  if (isForward) {
    slides[currentSlide].classList.remove(reverseClass)
  } else {
    slides[currentSlide].classList.add(reverseClass)
  }
}
navigate(true)

window.addEventListener(nextEventType, (event) => {
  if(currentSlide >= finalSlideIndex) {
    return
  }
  navigate(true)
})

window.addEventListener(previousEventType, (event) => {
  if (currentSlide === 0) {
    return
  }
  navigate(false)
})

</script>
