// use as custom element <clock> anywhere on the page
(() => {
  const svgNamespace = 'http://www.w3.org/2000/svg'
  const element = (name, attributes = {}) => {
    const node = document.createElementNS(svgNamespace, name)
    for (const [attribute, value] of Object.entries(attributes)) {
      node.setAttribute(attribute, value)
    }
    return node
  }

  class MdcoachClock extends HTMLElement {
    constructor() {
      super()
      this.attachShadow({ mode: 'open' })
    }

    connectedCallback() {
      window.clearInterval(this.timer)

      const style = document.createElement('style')
      style.textContent = `
        :host {
          display: block;
          width: 100%;
          height: 100%;
        }

        svg {
          width: 100%;
          height: 100%;
        }

        .clock-face { stroke: #333; fill: white; }
        .minor { stroke: #999; stroke-width: 0.5; }
        .major { stroke: #333; stroke-width: 1; }
        .hour { stroke: #333; }
        .minute { stroke: #666; }
        .second, .second-counterweight { stroke: rgb(180, 0, 0); }
        .second-counterweight { stroke-width: 3; }
      `

      this.svg = element('svg', { viewBox: '-50 -50 100 100' })
      this.svg.append(element('circle', { class: 'clock-face', r: '48' }))

      for (let minute = 0; minute < 60; minute += 5) {
        this.svg.append(element('line', {
          class: 'major',
          y1: '35',
          y2: '45',
          transform: `rotate(${6 * minute})`,
        }))

        for (let offset = 1; offset <= 4; offset++) {
          this.svg.append(element('line', {
            class: 'minor',
            y1: '42',
            y2: '45',
            transform: `rotate(${6 * (minute + offset)})`,
          }))
        }
      }

      this.hourHand = element('line', { class: 'hour', y1: '2', y2: '-20' })
      this.minuteHand = element('line', { class: 'minute', y1: '4', y2: '-30' })
      this.secondHand = element('g')
      this.secondHand.append(
        element('line', { class: 'second', y1: '10', y2: '-38' }),
        element('line', { class: 'second-counterweight', y1: '10', y2: '2' }),
      )
      this.svg.append(this.hourHand, this.minuteHand, this.secondHand)
      this.shadowRoot.replaceChildren(style, this.svg)

      this.updateTime()
      this.timer = window.setInterval(() => this.updateTime(), 1000)
    }

    disconnectedCallback() {
      window.clearInterval(this.timer)
      this.timer = undefined
    }

    updateTime() {
      const time = new Date()
      const hours = time.getHours()
      const minutes = time.getMinutes()
      const seconds = time.getSeconds()

      this.hourHand.setAttribute('transform', `rotate(${30 * hours + minutes / 2})`)
      this.minuteHand.setAttribute('transform', `rotate(${6 * minutes + seconds / 10})`)
      this.secondHand.setAttribute('transform', `rotate(${6 * seconds})`)
    }
  }

  if (!customElements.get('clock')) {
    customElements.define('clock', MdcoachClock)
  }
})()
// use as custom element <dark-light-toggle> anywhere on the page
(() => {
  const svgNamespace = 'http://www.w3.org/2000/svg'

  class DarkLightToggle extends HTMLElement {
    constructor() {
      super()
      this.attachShadow({ mode: 'open' })
    }

    connectedCallback() {
      this.darkMode = window.localStorage.getItem('darkMode') === 'true'
      document.body.classList.toggle('dark', this.darkMode)

      const style = document.createElement('style')
      style.textContent = `
        button {
          align-items: center;
          display: inline-flex;
          gap: 0.4em;
        }

        svg {
          fill: currentColor;
          height: 1em;
          width: 1em;
        }
      `

      const button = document.createElement('button')
      button.type = 'button'
      button.append(this.createIcon(), document.createTextNode(this.label))
      button.addEventListener('click', () => this.toggle())
      this.shadowRoot.replaceChildren(style, button)
    }

    get label() {
      return this.darkMode ? 'Dark' : 'Light'
    }

    createIcon() {
      const icon = document.createElementNS(svgNamespace, 'svg')
      icon.setAttribute('viewBox', '0 0 24 24')
      icon.setAttribute('aria-hidden', 'true')
      const path = document.createElementNS(svgNamespace, 'path')
      path.setAttribute('d', 'M12 3a9 9 0 1 0 9 9c0-.5-.04-1-.12-1.48A7 7 0 0 1 13.48 3.12C13 3.04 12.5 3 12 3Z')
      icon.append(path)
      return icon
    }

    toggle() {
      this.darkMode = !this.darkMode
      if (this.darkMode) {
        window.localStorage.setItem('darkMode', 'true')
      } else {
        window.localStorage.removeItem('darkMode')
      }
      document.body.classList.toggle('dark', this.darkMode)
      this.shadowRoot.querySelector('button').lastChild.textContent = this.label
    }
  }

  if (!customElements.get('dark-light-toggle')) {
    customElements.define('dark-light-toggle', DarkLightToggle)
  }
})()
// ============== debounce.js =====================

function debounce(callback, delay = 0) {
  let timeoutId;

  return function (...args) {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
      timeoutId = undefined;
      callback.apply(this, args);
    }, Math.max(10, delay));
  };
}
// ============== input.js =====================

let isCurtainVisible = false
const curtain = document.querySelector("body > aside.curtain")
const showCurtain = () => {
  curtain.style.display = "grid";
  isCurtainVisible = true
}
const hideCurtain = () => {
  curtain.style.display = "none";
  isCurtainVisible = false
}

const nextEventType = "nextListItemOrSlide"
const next = (event) => {
  event.preventDefault()
  window.dispatchEvent(new CustomEvent(nextEventType, {
    bubbles: true,
    cancelable: true,
    detail: event
  }))
}

const previousEventType = "previousSlide"
const previous = (event) => {
  event.preventDefault()
  window.dispatchEvent(new CustomEvent(previousEventType, {
    bubbles: true,
    cancelable: true,
    detail: event
  }))
}

document.addEventListener(
  'keydown',
  (event) => {
    if (isCurtainVisible) {
      switch (event.code) {
        case 'Escape':
        case 'Period':
          hideCurtain()
      }
      return
    }
    switch (event.code) {
      case 'ArrowRight':
      case 'ArrowDown':
      case 'PageDown':
      case 'Space':
      case 'KeyJ':
        next(event)
        return
      case 'ArrowLeft':
      case 'ArrowUp':
      case 'PageUp':
      case 'Backspace':
      case 'KeyK':
        previous(event)
        return
      case 'KeyC':
        window.open(window.location.href, '_blank')
        return
      case 'Period':
        showCurtain()
      case 'KeyR':
        window.location.reload()
    }
  }
)

document.addEventListener(
  'wheel',
  debounce((event) => {
    if (isCurtainVisible) {
      return
    }
    if (event.deltaY >= 0) {
      next(event)
    } else {
      previous(event)
    }
  }, 4)
)
// ============== slides.js =====================

let currentSlide = 0
let currentListItem = 0

const focusedClass = "is-focused"
const reverseClass = "reverse"
const slides = document.querySelectorAll('main > section')
const finalSlideIndex = slides.length - 1
slides[currentSlide].classList.add(focusedClass)
slides[currentSlide].classList.add(reverseClass)

const getCurrentConcealedListItems = () => {
  return slides[currentSlide].querySelectorAll(":scope > .grid > .content > ul > li:not(.is-revealed)")
}

const navigate = (targetSlide) => {
  const isForward = targetSlide > currentSlide

  let currentSlideClassList = slides[currentSlide].classList
  currentSlideClassList.remove(focusedClass)
  if (isForward) {
    currentSlideClassList.add(reverseClass)
  } else {
    currentSlideClassList.remove(reverseClass)
  }
  currentSlide = targetSlide

  currentSlideClassList = slides[currentSlide].classList
  currentSlideClassList.add(focusedClass)
  if (isForward) {
    currentSlideClassList.remove(reverseClass)
  } else {
    currentSlideClassList.add(reverseClass)
  }

  const title = document.title.replace(/^\d+\/\d+\s*/, '')
  document.title = `${currentSlide + 1}/${finalSlideIndex + 1} ${title}`
  window.history.replaceState(null, null, '#' + (currentSlide + 1))
}

const navigationCompleteEventType = "slideNavigationFinished"
const dispatchNavigationCompleteEvent = (concealedListItemCount) => {
  window.dispatchEvent(
    new CustomEvent(
      navigationCompleteEventType,
      {
        detail: {
          slideIndex: currentSlide,
          concealedListItemCount: concealedListItemCount
        }
    })
  )
}

window.addEventListener(nextEventType, (event) => {
  if(currentSlide >= finalSlideIndex) {
    return
  }
  let concealedListItems = getCurrentConcealedListItems()
  for (const element of concealedListItems) {
    element.classList.add("is-revealed")
    debounce(dispatchNavigationCompleteEvent, 100)(
      concealedListItems.length-1
    )
    return
  }
  navigate(currentSlide + 1)
  concealedListItems = getCurrentConcealedListItems()
  debounce(dispatchNavigationCompleteEvent, 100)(
    concealedListItems.length
  )
})

window.addEventListener(previousEventType, (event) => {
  if (currentSlide === 0) {
    return
  }
  navigate(currentSlide - 1)
  const concealedListItems = getCurrentConcealedListItems()
  debounce(dispatchNavigationCompleteEvent, 100)(
    concealedListItems.length
  )
})

const getSlideIndexFromLocationHash = () => {
  const rawHash = window.location.hash.substring(1);

  // Parse the string into a numeric value
  let numericValue = parseInt(rawHash, 10);

  // Check if it is a valid number
  if (isNaN(numericValue)) {
    return 0
  }
  numericValue--
  if (numericValue < 0) {
    return 0
  }
  if (numericValue > finalSlideIndex) {
    return finalSlideIndex
  }
  return numericValue
}

const navigateToWindowHashLocation = () => {
  const slideIndex = getSlideIndexFromLocationHash()
  if (slideIndex === currentSlide) {
    return
  }
  navigate(slideIndex)
}
window.addEventListener(
  "hashchange",
  navigateToWindowHashLocation
)

navigateToWindowHashLocation()
// ============== scale.js =====================

function scaleElementDown(element) {
  const attribute = element.getAttribute("data-scale")
  const current = Number.parseInt(attribute ?? "100", 10)
  if (current < 20) {
    return false
  }
  element.setAttribute("data-scale", String(current - 10))
  return true
}

let topEdge = 20
function isTooLarge(element) {
  return (element.getBoundingClientRect().height + topEdge) > window.innerHeight
}

function scaleDown() {
  let scaling = false
  for (const slide of slides) {
    const element = slide.querySelector(":scope > .grid > .content")
    if (isTooLarge(element)) {
      scaling = scaleElementDown(element)
    }
  }

  if (scaling) {
    window.setTimeout(scaleDown, 150)
  }
}

window.setTimeout(() => {
  // topEdge = slides[0]?.getBoundingClientRect().top ?? 20
  // console.log("topEdge", topEdge)
  topEdge = parseFloat(window.getComputedStyle(slides[0].querySelector(":scope > .grid")).paddingTop)
  scaleDown()
}, 150)

window.addEventListener("resize", debounce(() => {
  for (const slide of slides) {
    const element = slide.querySelector(":scope > .grid > .content")
    element.setAttribute("data-scale", "100")
  }
  window.setTimeout(scaleDown, 150)
}, 200))
// ============== synchronize.js =====================
const documentID = document.querySelector("html").dataset.id ||
  "random"+Math.random().toString(36) + Date.now().toString(36)
const channel = new BroadcastChannel(documentID)
const windowID = documentID + '|' + Math.random().toString(36) + '|' + Date.now()

window.addEventListener(navigationCompleteEventType, (event) => {
  const navigationComplete = event.detail
  channel.postMessage({
    slideIndex: navigationComplete.slideIndex,
    concealedListItemCount: navigationComplete.concealedListItemCount,
    window: windowID
  });
})

channel.addEventListener('message', (event) => {
  const broadcast = event.data
  if (broadcast.window === windowID) {
    return
  }
  if (broadcast.slideIndex !== currentSlide) {
    navigate(broadcast.slideIndex)
  }
  const concealedListItems = getCurrentConcealedListItems()
  let revealCount = concealedListItems.length - broadcast.concealedListItemCount
  for (const element of concealedListItems) {
    if (revealCount === 0) {
      return
    }
    element.classList.add("is-revealed")
    revealCount--
  }
});
