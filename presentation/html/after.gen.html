</main><script>
// ============== input.js =====================

let isCurtainVisible = false
const curtain = document.querySelector("body > aside.curtain")
const showCurtain = () => {
  curtain.style.display = "grid";
  isCurtainVisible = true
}
const hideCurtain = () => {
  curtain.style.display = "none";
  isCurtainVisible = false
}

const nextEventType = "nextListItemOrSlide"
const next = (event) => {
  event.preventDefault()
  window.dispatchEvent(new CustomEvent(nextEventType, {
    bubbles: true,
    cancelable: true,
    detail: event
  }))
}

const previousEventType = "previousSlide"
const previous = (event) => {
  event.preventDefault()
  window.dispatchEvent(new CustomEvent(previousEventType, {
    bubbles: true,
    cancelable: true,
    detail: event
  }))
}

document.addEventListener(
  'keydown',
  (event) => {
    if (isCurtainVisible) {
      switch (event.code) {
        case 'Escape':
        case 'Period':
          hideCurtain()
      }
      return
    }
    switch (event.code) {
      case 'ArrowRight':
      case 'ArrowDown':
      case 'PageDown':
      case 'Space':
      case 'KeyJ':
        next(event)
        return
      case 'ArrowLeft':
      case 'ArrowUp':
      case 'PageUp':
      case 'Backspace':
      case 'KeyK':
        previous(event)
        return
      case 'KeyC':
        window.open(window.location.href, '_blank')
        return
      case 'Period':
        showCurtain()
      case 'KeyR':
        window.location.reload()
    }
  }
)

document.addEventListener(
  'wheel',
  debounce((event) => {
    if (isCurtainVisible) {
      return
    }
    if (event.deltaY >= 0) {
      next(event)
    } else {
      previous(event)
    }
  }, 4)
)
// ============== slides.js =====================

let currentSlide = 0
let currentListItem = 0

const focusedClass = "is-focused"
const reverseClass = "reverse"
const slides = document.querySelectorAll('main > section')
const finalSlideIndex = slides.length - 1
slides[currentSlide].classList.add(focusedClass)
slides[currentSlide].classList.add(reverseClass)

const getCurrentConcealedListItems = () => {
  return slides[currentSlide].querySelectorAll(":scope > .grid > .content > ul > li:not(.is-revealed)")
}

const navigate = (targetSlide) => {
  const isForward = targetSlide > currentSlide

  let currentSlideClassList = slides[currentSlide].classList
  currentSlideClassList.remove(focusedClass)
  if (isForward) {
    currentSlideClassList.add(reverseClass)
  } else {
    currentSlideClassList.remove(reverseClass)
  }
  currentSlide = targetSlide

  currentSlideClassList = slides[currentSlide].classList
  currentSlideClassList.add(focusedClass)
  if (isForward) {
    currentSlideClassList.remove(reverseClass)
  } else {
    currentSlideClassList.add(reverseClass)
  }

  const title = document.title.replace(/^\d+\/\d+\s*/, '')
  document.title = `${currentSlide + 1}/${finalSlideIndex + 1} ${title}`
  window.history.replaceState(null, null, '#' + (currentSlide + 1))
}

const navigationCompleteEventType = "slideNavigationFinished"
const dispatchNavigationCompleteEvent = (concealedListItemCount) => {
  window.dispatchEvent(
    new CustomEvent(
      navigationCompleteEventType,
      {
        detail: {
          slideIndex: currentSlide,
          concealedListItemCount: concealedListItemCount
        }
    })
  )
}

window.addEventListener(nextEventType, (event) => {
  if(currentSlide >= finalSlideIndex) {
    return
  }
  let concealedListItems = getCurrentConcealedListItems()
  for (const element of concealedListItems) {
    element.classList.add("is-revealed")
    debounce(dispatchNavigationCompleteEvent, 100)(
      concealedListItems.length-1
    )
    return
  }
  navigate(currentSlide + 1)
  concealedListItems = getCurrentConcealedListItems()
  debounce(dispatchNavigationCompleteEvent, 100)(
    concealedListItems.length
  )
})

window.addEventListener(previousEventType, (event) => {
  if (currentSlide === 0) {
    return
  }
  navigate(currentSlide - 1)
  const concealedListItems = getCurrentConcealedListItems()
  debounce(dispatchNavigationCompleteEvent, 100)(
    concealedListItems.length
  )
})

const getSlideIndexFromLocationHash = () => {
  const rawHash = window.location.hash.substring(1);

  // Parse the string into a numeric value
  let numericValue = parseInt(rawHash, 10);

  // Check if it is a valid number
  if (isNaN(numericValue)) {
    return 0
  }
  numericValue--
  if (numericValue < 0) {
    return 0
  }
  if (numericValue > finalSlideIndex) {
    return finalSlideIndex
  }
  return numericValue
}

const navigateToWindowHashLocation = () => {
  const slideIndex = getSlideIndexFromLocationHash()
  if (slideIndex === currentSlide) {
    return
  }
  navigate(slideIndex)
}
window.addEventListener(
  "hashchange",
  navigateToWindowHashLocation
)

navigateToWindowHashLocation()
// ============== scale.js =====================

function scaleElementDown(element) {
  const attribute = element.getAttribute("data-scale")
  const current = Number.parseInt(attribute ?? "100", 10)
  if (current < 20) {
    return false
  }
  element.setAttribute("data-scale", String(current - 10))
  return true
}

let topEdge = 20
function isTooLarge(element) {
  return (element.getBoundingClientRect().height + topEdge) > window.innerHeight
}

function scaleDown() {
  let scaling = false
  for (const slide of slides) {
    const element = slide.querySelector(":scope > .grid > .content")
    if (isTooLarge(element)) {
      scaling = scaleElementDown(element)
    }
  }

  if (scaling) {
    window.setTimeout(scaleDown, 150)
  }
}

window.setTimeout(() => {
  // topEdge = slides[0]?.getBoundingClientRect().top ?? 20
  // console.log("topEdge", topEdge)
  topEdge = parseFloat(window.getComputedStyle(slides[0].querySelector(":scope > .grid")).paddingTop)
  scaleDown()
}, 150)

window.addEventListener("resize", debounce(() => {
  for (const slide of slides) {
    const element = slide.querySelector(":scope > .grid > .content")
    element.setAttribute("data-scale", "100")
  }
  window.setTimeout(scaleDown, 150)
}, 200))
// ============== synchronize.js =====================
const documentID = document.querySelector("html").dataset.id ||
  "random"+Math.random().toString(36) + Date.now().toString(36)
const channel = new BroadcastChannel(documentID)
const windowID = documentID + '|' + Math.random().toString(36) + '|' + Date.now()

window.addEventListener(navigationCompleteEventType, (event) => {
  const navigationComplete = event.detail
  channel.postMessage({
    slideIndex: navigationComplete.slideIndex,
    concealedListItemCount: navigationComplete.concealedListItemCount,
    window: windowID
  });
})

channel.addEventListener('message', (event) => {
  const broadcast = event.data
  if (broadcast.window === windowID) {
    return
  }
  if (broadcast.slideIndex !== currentSlide) {
    navigate(broadcast.slideIndex)
  }
  const concealedListItems = getCurrentConcealedListItems()
  let revealCount = concealedListItems.length - broadcast.concealedListItemCount
  for (const element of concealedListItems) {
    if (revealCount === 0) {
      return
    }
    element.classList.add("is-revealed")
    revealCount--
  }
});
</script>
