<script>
// ============== debounce.js =====================

function debounce(callback, delay = 0) {
  let timeoutId;

  return function (...args) {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
      timeoutId = undefined;
      callback.apply(this, args);
    }, Math.max(10, delay));
  };
}
const svgNamespace = 'http://www.w3.org/2000/svg'

const element = (name, attributes = {}) => {
  const node = document.createElementNS(svgNamespace, name)
  for (const [attribute, value] of Object.entries(attributes)) {
    node.setAttribute(attribute, value)
  }
  return node
}
// use as <keystroke-combo timeout="1000">; timeout is in milliseconds

const keyStrokeCompleteEventType = "keystroke-combo-complete"

class KeystrokeCombo extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.keys = []
    this.recording = false
    this.timeout = undefined
    this.onClick = this.onClick.bind(this)
    this.onKeyDown = this.onKeyDown.bind(this)
    this.finishRecording = this.finishRecording.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        cursor: text;
        display: inline-flex;
        max-width: 100%;
      }

      :host(:focus-visible) output {
        outline: 2px solid var(--color-marker-background, #006eff);
        outline-offset: 2px;
      }

      output {
        align-items: center;
        background: var(--color-menu-background, #eee);
        border: 1px solid var(--color-menu-text, #666);
        border-radius: 0.25rem;
        color: var(--color-menu-text, #666);
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        min-height: 1.5rem;
        min-width: 6rem;
        padding: 0.25rem 0.5rem;
      }

      :host([recording]) output {
        border-color: var(--color-marker-background, #006eff);
      }

      kbd {
        background: var(--color-body-background, white);
        border: 1px solid currentColor;
        border-radius: 0.2rem;
        font: inherit;
        padding: 0.05rem 0.3rem;
      }

      .separator,
      .placeholder {
        opacity: 0.65;
      }
    `

    const pattern = this.getAttribute('filter')
    if (pattern === null) {
      this.matchesFilter = (key) => true
    } else {
      const filter = new RegExp(pattern)
      this.matchesFilter = (key) => filter.test(key)
    }

    this.output = document.createElement('output')
    this.output.setAttribute('aria-live', 'polite')
    this.shadowRoot.replaceChildren(style, this.output)

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'group')
    }
    if (!this.hasAttribute('aria-label')) {
      this.setAttribute('aria-label', 'Keystroke sequence recorder')
    }
    if (!this.hasAttribute('tabindex')) {
      this.setAttribute('tabindex', '0')
    }

    this.addEventListener('click', this.onClick)
    window.addEventListener('keydown', this.onKeyDown)
    this.renderKeys()
  }

  disconnectedCallback() {
    window.clearTimeout(this.timeout)
    this.timeout = undefined
    this.recording = false
    this.removeAttribute('recording')
    this.removeEventListener('click', this.onClick)
    window.removeEventListener('keydown', this.onKeyDown)
  }

  onClick() {
    this.focus({ preventScroll: true })
  }

  onKeyDown(event) {
    if (event.repeat || event.isComposing || !this.matchesFilter(event.key)) {
      return
    }

    const key = event.key === ' ' ? 'Space' : event.key
    if (!key) {
      return
    }

    event.preventDefault()
    event.stopPropagation()

    if (!this.recording) {
      this.keys = []
      this.recording = true
      this.setAttribute('recording', '')
    }

    this.keys.push(key)
    this.renderKeys()
    window.clearTimeout(this.timeout)
    this.timeout = window.setTimeout(
      this.finishRecording,
      this.getTimeoutDuration(),
    )
  }

  getTimeoutDuration() {
    const value = this.getAttribute('timeout')
    if (value === null) {
      return 1000
    }

    const duration = Number(value)
    return Number.isFinite(duration) && duration >= 0 ? duration : 1000
  }

  renderKeys() {
    if (this.keys.length === 0) {
      const placeholder = document.createElement('span')
      placeholder.className = 'placeholder'
      placeholder.textContent = this.getAttribute('placeholder') || 'Press keys'
      this.output.replaceChildren(placeholder)
      return
    }

    const contents = []
    for (const [index, key] of this.keys.entries()) {
      // if (index > 0) {
      //   const separator = document.createElement('span')
      //   separator.className = 'separator'
      //   separator.textContent = '→'
      //   contents.push(separator)
      // }
      const keycap = document.createElement('kbd')
      keycap.textContent = key
      contents.push(keycap)
    }
    this.output.replaceChildren(...contents)
  }

  finishRecording() {
    if (!this.recording) {
      return
    }

    this.recording = false
    this.timeout = undefined
    this.removeAttribute('recording')
    this.dispatchEvent(new CustomEvent(
      keyStrokeCompleteEventType, {
      bubbles: true,
      composed: true,
      detail: this.keys.join(' '),
    }))
  }
}

if (!customElements.get('keystroke-combo')) {
  customElements.define('keystroke-combo', KeystrokeCombo)
}
// use as custom element <presentation-menu> around presentation controls

class PresentationMenu extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onMouseMove = this.onMouseMove.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        display: block;
        left: 50%;
        position: fixed;
        top: 0;
        transform: translate(-50%, -100%);
        transition: transform 220ms ease;
        z-index: 1000;
      }

      :host([open]) {
        transform: translate(-50%, 0);
      }

      nav {
        align-items: center;
        background: var(--color-menu-background, #eee);
        border-radius: 0 0 0.5rem 0.5rem;
        box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 20%);
        box-sizing: border-box;
        color: var(--color-menu-text, #666);
        display: flex;
        gap: 0.5rem;
        max-width: calc(100vw - 1rem);
        padding: 0.5rem;
      }

      @media (prefers-reduced-motion: reduce) {
        :host {
          transition: none;
        }
      }
    `

    this.navigation = document.createElement('nav')
    this.navigation.setAttribute('aria-label', this.getAttribute('label') || 'Presentation menu')
    const slot = document.createElement('slot')
    this.navigation.append(slot)
    this.shadowRoot.replaceChildren(style, this.navigation)

    this.updateVisibility(this.hasAttribute('open'))
    window.addEventListener('mousemove', this.onMouseMove, { passive: true })
  }

  disconnectedCallback() {
    window.removeEventListener('mousemove', this.onMouseMove)
  }

  onMouseMove(event) {
    const revealBoundary = window.innerHeight * 0.15
    const shouldOpen = event.clientY <= revealBoundary || this.matches(':hover')
    this.updateVisibility(shouldOpen)
  }

  updateVisibility(isVisible) {
    this.toggleAttribute('open', isVisible)
    if (!this.navigation) {
      return
    }

    this.navigation.inert = !isVisible
    this.navigation.setAttribute('aria-hidden', String(!isVisible))
  }
}

  customElements.define('presentation-menu', PresentationMenu)
}
// use as <presentation-side-button side="left|right"> around side controls

class PresentationSideButton extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onMouseMove = this.onMouseMove.bind(this)
  }

  connectedCallback() {
    if (this.getAttribute('side') !== 'right') {
      this.setAttribute('side', 'left')
    }

    const style = document.createElement('style')
    style.textContent = `
      :host {
        display: block;
        position: fixed;
        top: 50%;
        transition: transform 220ms ease;
        z-index: 1000;
        cursor: pointer;
      }

      :host([side="left"]) {
        left: 0;
        transform: translate(-100%, -50%);
      }

      :host([side="left"][open]) {
        transform: translate(0, -50%);
      }

      :host([side="right"]) {
        right: 0;
        transform: translate(100%, -50%);
      }

      :host([side="right"][open]) {
        transform: translate(0, -50%);
      }

      aside {
        align-items: center;
        background: var(--color-menu-background, #eee);
        box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 20%);
        box-sizing: border-box;
        color: var(--color-menu-text, #666);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-height: calc(100vh - 2rem);
        overflow: auto;
        padding: 0.5rem;
      }

      :host([side="left"]) aside {
        border-radius: 0 0.5rem 0.5rem 0;
      }

      :host([side="right"]) aside {
        border-radius: 0.5rem 0 0 0.5rem;
      }

      @media (prefers-reduced-motion: reduce) {
        :host {
          transition: none;
        }
      }
    `

    this.panel = document.createElement('aside')
    this.panel.setAttribute('aria-label', this.getAttribute('label') || 'Presentation side controls')
    this.panel.append(document.createElement('slot'))
    this.shadowRoot.replaceChildren(style, this.panel)

    this.updateVisibility(this.hasAttribute('open'))
    window.addEventListener('mousemove', this.onMouseMove, { passive: true })
  }

  disconnectedCallback() {
    window.removeEventListener('mousemove', this.onMouseMove)
  }

  onMouseMove(event) {
    const edgeDistance = window.innerWidth * 0.15
    const nearDock = this.getAttribute('side') === 'right'
      ? event.clientX >= window.innerWidth - edgeDistance
      : event.clientX <= edgeDistance
    const shouldOpen = nearDock || this.matches(':hover') || this.matches(':focus-within')
    this.updateVisibility(shouldOpen)
  }

  updateVisibility(isVisible) {
    this.toggleAttribute('open', isVisible)
    if (!this.panel) {
      return
    }

    this.panel.inert = !isVisible
    this.panel.setAttribute('aria-hidden', String(!isVisible))
  }
}

if (!customElements.get('presentation-side-button')) {
  customElements.define('presentation-side-button', PresentationSideButton)
}
// use as custom element <dark-light-toggle> around document-provided content

class DarkLightToggle extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onClick = this.onClick.bind(this)
    this.onKeyDown = this.onKeyDown.bind(this)
  }

  connectedCallback() {
    this.darkMode = window.localStorage.getItem('darkMode') === 'true'
    this.applyTheme()

    const style = document.createElement('style')
    style.textContent = `
      :host {
        align-items: center;
        cursor: pointer;
        display: inline-flex;
      }

      ::slotted(svg) {
        fill: currentColor;
        height: 1em;
        margin-inline-start: 0.4em;
        width: 1em;
      }

      :host(:focus-visible) {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
    `

    this.shadowRoot.replaceChildren(style, document.createElement('slot'))

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'button')
    }
    if (!this.hasAttribute('tabindex')) {
      this.setAttribute('tabindex', '0')
    }

    this.addEventListener('click', this.onClick)
    this.addEventListener('keydown', this.onKeyDown)
    this.updatePressedState()
  }

  disconnectedCallback() {
    this.removeEventListener('click', this.onClick)
    this.removeEventListener('keydown', this.onKeyDown)
  }

  applyTheme() {
    document.documentElement.dataset.theme = this.darkMode ? 'dark' : 'light'
  }

  updatePressedState() {
    this.setAttribute('aria-pressed', String(this.darkMode))
  }

  onClick() {
    this.toggle()
  }

  onKeyDown(event) {
    if (event.code !== 'Enter' && event.code !== 'Space') {
      return
    }

    event.preventDefault()
    this.toggle()
  }

  toggle() {
    this.darkMode = !this.darkMode
    if (this.darkMode) {
      window.localStorage.setItem('darkMode', 'true')
    } else {
      window.localStorage.removeItem('darkMode')
    }
    this.applyTheme()
    this.updatePressedState()
  }
}

if (!customElements.get('dark-light-toggle')) {
  customElements.define('dark-light-toggle', DarkLightToggle)
}
// use as custom element <fullscreen-toggle> with its label as text content

class FullscreenToggle extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onKeyDown = this.onKeyDown.bind(this)
    this.onActivateKeyDown = this.onActivateKeyDown.bind(this)
    this.updateState = this.updateState.bind(this)
    this.onClick = this.onClick.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        cursor: pointer;
        display: inline-block;
      }

      :host([fullscreen]) {
        color: red;
      }

      :host(:focus-visible) {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
    `

    const slot = document.createElement('slot')
    this.shadowRoot.replaceChildren(style, slot)

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'button')
    }
    if (!this.hasAttribute('tabindex')) {
      this.setAttribute('tabindex', '0')
    }

    this.addEventListener('click', this.onClick)
    this.addEventListener('keydown', this.onActivateKeyDown)
    document.addEventListener('keydown', this.onKeyDown)
    document.addEventListener('fullscreenchange', this.updateState)
    document.addEventListener('webkitfullscreenchange', this.updateState)
    this.updateState()
  }

  disconnectedCallback() {
    this.removeEventListener('click', this.onClick)
    this.removeEventListener('keydown', this.onActivateKeyDown)
    document.removeEventListener('keydown', this.onKeyDown)
    document.removeEventListener('fullscreenchange', this.updateState)
    document.removeEventListener('webkitfullscreenchange', this.updateState)
  }

  onClick() {
    this.toggleFullscreen()
  }

  onActivateKeyDown(event) {
    if (
      (event.code !== 'Enter' && event.code !== 'Space') ||
      this.isEditableTarget(event.target)
    ) {
      return
    }

    event.preventDefault()
    this.toggleFullscreen()
  }

  onKeyDown(event) {
    if (
      event.code !== 'KeyF' ||
      event.altKey ||
      event.ctrlKey ||
      event.metaKey ||
      event.shiftKey ||
      this.isEditableTarget(event.target)
    ) {
      return
    }

    event.preventDefault()
    this.toggleFullscreen()
  }

  isEditableTarget(target) {
    return target instanceof Element && (
      target.isContentEditable ||
      target.matches('input, textarea, select')
    )
  }

  isFullscreen() {
    return Boolean(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.fullScreenElement ||
      document.webkitIsFullScreen
    )
  }

  async toggleFullscreen() {
    try {
      if (this.isFullscreen()) {
        const exit =
          document.exitFullscreen ||
          document.exitFullScreen ||
          document.cancelFullScreen ||
          document.webkitCancelFullScreen
        if (exit) {
          await exit.call(document)
        }
        return
      }

      const root = document.documentElement
      const request =
        root.requestFullscreen ||
        root.requestFullScreen ||
        root.webkitRequestFullScreen
      if (request) {
        await request.call(root)
      }
    } catch (error) {
      this.dispatchEvent(new CustomEvent('fullscreenerror', {
        bubbles: true,
        composed: true,
        detail: error,
      }))
    }
  }

  updateState() {
    const fullscreen = this.isFullscreen()
    this.toggleAttribute('fullscreen', fullscreen)
    this.setAttribute('aria-pressed', String(fullscreen))
  }
}

if (!customElements.get('fullscreen-toggle')) {
  customElements.define('fullscreen-toggle', FullscreenToggle)
}
// use as custom element <clock> anywhere on the page

class PresentationClock extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
  }

  connectedCallback() {
    window.clearInterval(this.timer)

    const style = document.createElement('style')
    style.textContent = `
      :host {
        display: block;
        width: 100%;
        height: 100%;
      }

      svg {
        width: 100%;
        height: 100%;
      }

      .clock-face { stroke: #333; fill: white; }
      .minor { stroke: #999; stroke-width: 0.5; }
      .major { stroke: #333; stroke-width: 1; }
      .hour { stroke: #333; }
      .minute { stroke: #666; }
      .second, .second-counterweight { stroke: rgb(180, 0, 0); }
      .second-counterweight { stroke-width: 3; }
    `

    this.svg = element('svg', { viewBox: '-50 -50 100 100' })
    this.svg.append(element('circle', { class: 'clock-face', r: '48' }))

    for (let minute = 0; minute < 60; minute += 5) {
      this.svg.append(element('line', {
        class: 'major',
        y1: '35',
        y2: '45',
        transform: `rotate(${6 * minute})`,
      }))

      for (let offset = 1; offset <= 4; offset++) {
        this.svg.append(element('line', {
          class: 'minor',
          y1: '42',
          y2: '45',
          transform: `rotate(${6 * (minute + offset)})`,
        }))
      }
    }

    this.hourHand = element('line', { class: 'hour', y1: '2', y2: '-20' })
    this.minuteHand = element('line', { class: 'minute', y1: '4', y2: '-30' })
    this.secondHand = element('g')
    this.secondHand.append(
      element('line', { class: 'second', y1: '10', y2: '-38' }),
      element('line', { class: 'second-counterweight', y1: '10', y2: '2' }),
    )
    this.svg.append(this.hourHand, this.minuteHand, this.secondHand)
    this.shadowRoot.replaceChildren(style, this.svg)

    this.updateTime()
    this.timer = window.setInterval(() => this.updateTime(), 1000)
  }

  disconnectedCallback() {
    window.clearInterval(this.timer)
    this.timer = undefined
  }

  updateTime() {
    const time = new Date()
    const hours = time.getHours()
    const minutes = time.getMinutes()
    const seconds = time.getSeconds()

    this.hourHand.setAttribute('transform', `rotate(${30 * hours + minutes / 2})`)
    this.minuteHand.setAttribute('transform', `rotate(${6 * minutes + seconds / 10})`)
    this.secondHand.setAttribute('transform', `rotate(${6 * seconds})`)
  }
}

if (!customElements.get('presentation-clock')) {
  customElements.define('presentation-clock', PresentationClock)
}
// use as <presentation-timer duration="60">; duration is in seconds

class PresentationTimer extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.elapsed = 0
    this.running = false
    this.frame = undefined
    this.startedAt = 0
    this.onClick = this.onClick.bind(this)
    this.onKeyDown = this.onKeyDown.bind(this)
    this.tick = this.tick.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        cursor: pointer;
        display: block;
        height: 100%;
        width: 100%;
      }

      :host(:focus-visible) {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }

      svg {
        height: 100%;
        width: 100%;
      }

      .track {
        fill: none;
        stroke: var(--color-body-subtext, #aaa);
        stroke-opacity: 0.35;
        stroke-width: 16;
      }

      .progress {
        fill: none;
        stroke: var(--color-marker-background, #006eff);
        stroke-linecap: round;
        stroke-width: 16;
        transition: stroke-opacity 150ms ease;
      }

      :host([paused]) .progress {
        stroke-opacity: 0.3;
      }

      @media (prefers-reduced-motion: reduce) {
        .progress {
          stroke-linecap: butt;
        }
      }
    `

    this.duration = this.getDuration()
    this.circumference = 2 * Math.PI * 42
    this.svg = element('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true' })
    this.trackCircle = element('circle', {
      class: 'track',
      cx: '50',
      cy: '50',
      r: '36',
    })
    this.progressCircle = element('circle', {
      class: 'progress',
      cx: '50',
      cy: '50',
      r: '36',
      transform: 'rotate(-90 50 50)',
      'stroke-dasharray': String(this.circumference),
      'stroke-dashoffset': String(this.circumference),
    })
    this.svg.append(this.trackCircle, this.progressCircle)
    this.shadowRoot.replaceChildren(style, this.svg)

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'button')
    }
    if (!this.hasAttribute('tabindex')) {
      this.setAttribute('tabindex', '0')
    }

    this.setAttribute('aria-label', `${this.duration / 1000} second timer`)
    this.addEventListener('click', this.onClick)
    this.addEventListener('keydown', this.onKeyDown)
    this.updateProgress(this.elapsed)
    this.updateState()
  }

  disconnectedCallback() {
    this.pause()
    this.removeEventListener('click', this.onClick)
    this.removeEventListener('keydown', this.onKeyDown)
  }

  getDuration() {
    const seconds = Number(this.getAttribute('duration'))
    return Number.isFinite(seconds) && seconds > 0 ? seconds * 1000 : 60_000
  }

  onClick() {
    if (this.running) {
      this.pause()
    } else {
      this.start()
    }
  }

  onKeyDown(event) {
    if ((event.code !== 'Enter' && event.code !== 'Space') || event.repeat) {
      return
    }

    event.preventDefault()
    this.onClick()
  }

  start() {
    if (this.elapsed >= this.duration) {
      this.elapsed = 0
    }

    this.startedAt = performance.now()
    this.running = true
    this.updateProgress(this.elapsed)
    this.updateState()
    this.frame = window.requestAnimationFrame(this.tick)
  }

  pause() {
    if (!this.running) {
      return
    }

    this.elapsed = Math.min(
      this.duration,
      this.elapsed + performance.now() - this.startedAt,
    )
    this.running = false
    window.cancelAnimationFrame(this.frame)
    this.frame = undefined
    this.updateProgress(this.elapsed)
    this.updateState()
  }

  tick(timestamp) {
    if (!this.running) {
      return
    }

    const elapsed = this.elapsed + timestamp - this.startedAt
    if (elapsed >= this.duration) {
      this.elapsed = this.duration
      this.running = false
      this.frame = undefined
      this.updateProgress(this.elapsed)
      this.updateState()
      return
    }

    this.updateProgress(elapsed)
    this.frame = window.requestAnimationFrame(this.tick)
  }

  updateProgress(elapsed) {
    const progress = Math.min(elapsed / this.duration, 1)
    this.progressCircle.setAttribute(
      'stroke-dashoffset',
      String(this.circumference * (1 - progress)),
    )
  }

  updateState() {
    this.toggleAttribute('paused', !this.running)
    this.setAttribute('aria-pressed', String(this.running))
    this.setAttribute(
      'aria-label',
      `${this.running ? 'Pause' : 'Start'} ${this.duration / 1000} second timer`,
    )
  }
}

if (!customElements.get('presentation-timer')) {
  customElements.define('presentation-timer', PresentationTimer)
}

      button {

        border: 1px solid var(--color-body-subtext, #aaa);
        border-radius: 0.3rem;
        color: inherit;
        cursor: pointer;
        font: inherit;
        line-height: 1.2;
        padding: 0.3rem 0.5rem;
        white-space: nowrap;
      }

      button:hover {
        border-color: var(--color-marker-background, #006eff);
      }

      button:focus-visible {
        outline: 2px solid var(--color-marker-background, #006eff);
        outline-offset: 2px;
      }

      output {
        align-items: center;
        background: var(--color-menu-background, #eee);
        border: 1px solid var(--color-body-subtext, #aaa);
        border-radius: 0.35rem;
        display: flex;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        gap: 0.2rem;
        padding: 0.45rem 0.6rem;
      }

      .slot {
        min-width: 2ch;
        text-align: center;
      }

      .separator,
      .unit {
        color: var(--color-body-subtext, #aaa);
      }

      @media (max-width: 30rem) {
        .controls {
          gap: 0.25rem;
        }

        button {
          font-size: 0.8rem;
          padding: 0.3rem;
        }
      }
    `

    this.output = document.createElement('output')
    this.output.setAttribute('aria-label', 'Timer duration')

    this.minutes = document.createElement('span')
    this.minutes.className = 'slot'
    this.minutes.setAttribute('aria-label', 'minutes')

    const separator = document.createElement('span')
    separator.className = 'separator'
    separator.textContent = ':'
    separator.setAttribute('aria-hidden', 'true')

    this.seconds = document.createElement('span')
    this.seconds.className = 'slot'
    this.seconds.setAttribute('aria-label', 'seconds')

    // const minuteUnit = document.createElement('span')
    // minuteUnit.className = 'unit'
    // minuteUnit.textContent = 'm'
    // minuteUnit.setAttribute('aria-hidden', 'true')
    // const secondUnit = document.createElement('span')
    // secondUnit.className = 'unit'
    // secondUnit.textContent = 's'
    // secondUnit.setAttribute('aria-hidden', 'true')
    // this.output.append(this.minutes, minuteUnit, separator, this.seconds, secondUnit)
    this.output.append(this.minutes, separator, this.seconds)

    const addButtons = document.createElement('div')
    addButtons.className = 'group'
    addButtons.append(
      this.createButton('Add 1 minute', '+1 min', 60),
      this.createButton('Add 5 minutes', '+5 min', 300),
    )

    const otherButtons = document.createElement('div')
    otherButtons.className = 'group'
    otherButtons.append(
      this.createButton('Reset timer', 'Reset', 'reset'),
      this.createButton('Subtract 30 seconds', '−30 sec', -30),
    )

    const controls = document.createElement('div')
    controls.className = 'controls'
    controls.append(addButtons, this.output, otherButtons)
    this.shadowRoot.replaceChildren(style, controls)
    this.shadowRoot.addEventListener('click', this.onClick)
    this.renderDuration()
    this.dispatchDurationChange()
  }

  disconnectedCallback() {
    this.shadowRoot.removeEventListener('click', this.onClick)
  }

  getDurationAttribute() {
    const value = Number(this.getAttribute('duration'))
    return Number.isFinite(value) && value >= 0 ? Math.floor(value) : 60
  }

  createButton(label, text, adjustment) {
    const button = document.createElement('button')
    button.type = 'button'
    button.textContent = text
    button.setAttribute('aria-label', label)
    button.dataset.adjustment = String(adjustment)
    return button
  }

  onClick(event) {
    const button = event.target.closest('button[data-adjustment]')
    if (!button) {
      return
    }

    const adjustment = button.dataset.adjustment
    if (adjustment === 'reset') {
      this.duration = this.defaultDuration
    } else {
      this.duration = Math.max(0, this.duration + Number(adjustment))
    }
    this.renderDuration()
    this.dispatchDurationChange()
  }

  dispatchDurationChange() {
    this.dispatchEvent(new CustomEvent('presentation-timer-change', {
      bubbles: true,
      composed: true,
      detail: this.duration,
    }))
  }

  renderDuration() {
    if (!this.minutes || !this.seconds) {
      return
    }

    const minutes = Math.floor(this.duration / 60)
    const seconds = this.duration % 60
    this.minutes.textContent = String(minutes).padStart(2, '0')
    this.seconds.textContent = String(seconds).padStart(2, '0')
    this.output.setAttribute('aria-label', `${minutes} minutes ${seconds} seconds`)
  }
}

// use as custom element <presentation-progress> for slide navigation progress

class PresentationProgress extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onNavigationComplete = this.onNavigationComplete.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        bottom: 0;
        display: block;
        height: 0.25rem;
        left: 0;
        pointer-events: none;
        position: fixed;
        width: 100vw;
        z-index: 10000;
        background: var(--color-body-subtext, #aaa);
      }


      .fill {
        background: var(--color-marker-background, #006eff);
        height: 100%;
        transition: width 600ms ease;
        width: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .fill {
          transition: none;
        }
      }
    `

    this.setAttribute('role', 'progressbar')
    this.setAttribute('aria-label', 'Presentation progress')
    this.setAttribute('aria-valuemin', '0')
    this.setAttribute('aria-valuemax', '100')

    this.fill = document.createElement('div')
    this.fill.className = 'fill'
    this.shadowRoot.replaceChildren(style, this.fill)

    this.updateProgress(0)
    window.addEventListener('slideNavigationFinished', this.onNavigationComplete)
  }

  disconnectedCallback() {
    window.removeEventListener('slideNavigationFinished', this.onNavigationComplete)
  }

  onNavigationComplete(event) {
    const { slideIndex, finalSlideIndex: finalSlideIndex } = event.detail
    if (!Number.isInteger(slideIndex) || !Number.isInteger(finalSlideIndex)) {
      return
    }

    const progress = finalSlideIndex > 0
      ? (slideIndex / finalSlideIndex) * 100
      : 100
    // console.log("got event", event.detail)
    this.updateProgress(Math.min(100, Math.max(0, progress)))
  }

  updateProgress(percentage) {
    this.fill.style.width = `${percentage}%`
    this.setAttribute('aria-valuenow', String(Math.round(percentage)))
    // console.log("progress:", percentage)
  }
}

if (!customElements.get('presentation-progress')) {
  customElements.define('presentation-progress', PresentationProgress)
}
// use as custom element <presentation-curtain> for a full-screen pause cover

const curtainOpenStorageKey = 'presentationCurtainOpen'

class PresentationCurtain extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onKeyUp = this.onKeyUp.bind(this)
  }

  static get observedAttributes() {
    return ['open']
  }

  connectedCallback() {
    const storedOpenState = this.readOpenState()
    const style = document.createElement('style')
    style.textContent = `
      :host {
        display: block;
        inset: 0;
        pointer-events: none;
        position: fixed;
        z-index: 9999998;
      }

      :host([open]) {
        pointer-events: auto;
      }

      .cover {
        align-items: center;
        background: linear-gradient(
          135deg,
          color-mix(in srgb, var(--color-marker-background, #006eff) 8%, var(--color-body-background, white)) 0%,
          color-mix(in srgb, var(--color-marker-background, #006eff) 12%, var(--color-body-background, white)) 33%,
          color-mix(in srgb, var(--color-marker-background, #006eff) 16%, var(--color-body-background, white)) 66%,
          color-mix(in srgb, var(--color-marker-background, #006eff) 20%, var(--color-body-background, white)) 100%
        );
        border-bottom: 0.2rem solid var(--color-body-subtext, #aaa);
        box-sizing: border-box;
        color: var(--color-body-subtext, #aaa);
        display: grid;
        font-size: 3rem;
        font-weight: bold;
        height: 100%;
        justify-content: center;
        transform: translateY(-100%);
        transition: transform 1450ms ease;
        width: 100%;
      }

      :host([open]) .cover {
        transform: translateY(0);
      }

      @media (prefers-reduced-motion: reduce) {
        .cover {
          transition: none;
        }
      }
    `

    if (!this.cover) {
      this.cover = document.createElement('div')
      this.cover.className = 'cover'
      this.cover.textContent = this.getAttribute('label') || '⏸'
      this.cover.setAttribute('aria-hidden', 'true')
    }
    this.shadowRoot.replaceChildren(style, this.cover)

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'status')
    }
    if (!this.hasAttribute('aria-label')) {
      this.setAttribute('aria-label', 'Presentation paused')
    }

    if (storedOpenState === null) {
      this.storeOpenState(this.hasAttribute('open'))
    } else {
      this.toggleAttribute('open', storedOpenState)
    }
    this.updateState()
    window.addEventListener('keyup', this.onKeyUp)
  }

  disconnectedCallback() {
    window.removeEventListener('keyup', this.onKeyUp)
  }

  attributeChangedCallback(name, oldValue, newValue) {
    if (oldValue === newValue) {
      return
    }

    this.updateState()
    if (this.isConnected) {
      this.storeOpenState(newValue !== null)
    }
  }

  onKeyUp(event) {
    if (event.code !== 'Period') {
      return
    }

    event.preventDefault()
    this.toggleAttribute('open')
  }

  readOpenState() {
    try {
      const storedState = window.localStorage.getItem(curtainOpenStorageKey)
      if (storedState === 'true') {
        return true
      }
      if (storedState === 'false') {
        return false
      }
    } catch {
      return null
    }
    return null
  }

  storeOpenState(isOpen) {
    try {
      window.localStorage.setItem(curtainOpenStorageKey, String(isOpen))
    } catch {
      // Local storage may be unavailable in restricted browsing contexts.
    }
  }

  updateState() {
    const isOpen = this.hasAttribute('open')
    this.setAttribute('aria-hidden', String(!isOpen))
    this.inert = !isOpen
  }
}

if (!customElements.get('presentation-curtain')) {
  customElements.define('presentation-curtain', PresentationCurtain)
}
// use as custom element <presentation-notes> to show notes from the focused slide

class PresentationNotes extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onToggle = this.onToggle.bind(this)
    this.onDOMReady = this.onDOMReady.bind(this)
    this.onNavigationComplete = this.onNavigationComplete.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        color: var(--color-menu-text, #666);
        display: block;
        height: 100vh;
        max-width: calc(100vw - 2.5rem);
        position: fixed;
        right: 0;
        top: 0;
        transform: translateX(calc(100% - 2.5rem));
        transition: transform 250ms ease;
        width: calc(36vw + 2.5rem);
        z-index: 9999;

        aside {
          background: var(--color-menu-background, #eee);
          box-shadow: 0 0 1rem rgb(0 0 0 / 20%);
          box-sizing: border-box;
          height: 100%;
          overflow: auto;
          padding: 1rem 1.25rem;
          margin-left: 2.5rem;
        }
      }

      :host([open]) {
        transform: translateX(0);
      }

      button {
        background: var(--color-menu-background, #eee);
        border: 1px solid var(--color-body-subtext, #aaa);
        border-right: 0;
        border-radius: 0.5rem 0 0 0.5rem;
        color: inherit;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
        left: 0;
        padding: 0.75rem 0.5rem;
        position: absolute;
        top: 10vh;
        writing-mode: vertical-rl;
        max-width: 4rem;
        overflow: hidden;
      }

      button:focus-visible {
        outline: 2px solid var(--color-marker-background, #006eff);
        outline-offset: 2px;
      }

      h2 {
        font-size: 1.25rem;
        margin: 0 0 1rem;
      }

      .content:empty::after {
        color: var(--color-body-subtext, #aaa);
        content: 'No notes for this slide.';
      }

      @media (prefers-reduced-motion: reduce) {
        :host {
          transition: none;
        }
      }
    `

    this.button = document.createElement('button')
    this.button.type = 'button'
    this.button.textContent = 'Notes'
    this.button.addEventListener('click', this.onToggle)

    this.dock = document.createElement('aside')
    this.dock.setAttribute('aria-label', 'Speaker notes')

    this.shadowRoot.replaceChildren(style, this.button, this.dock)
    this.updateState()
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', this.onDOMReady, { once: true })
    } else {
      this.updateNotes()
    }
    window.addEventListener('slideNavigationFinished', this.onNavigationComplete)
  }

  disconnectedCallback() {
    document.removeEventListener('DOMContentLoaded', this.onDOMReady)
    window.removeEventListener('slideNavigationFinished', this.onNavigationComplete)
    this.button?.removeEventListener('click', this.onToggle)
  }

  onToggle() {
    this.toggleAttribute('open')
    this.updateState()
  }

  onDOMReady() {
    this.updateNotes()
  }

  onNavigationComplete() {
    this.updateNotes()
  }

  updateState() {
    const isOpen = this.hasAttribute('open')
    this.button?.setAttribute('aria-expanded', String(isOpen))
    this.button?.setAttribute('aria-label', isOpen ? 'Hide speaker notes' : 'Show speaker notes')
    this.button?.setAttribute('title', isOpen ? 'Hide notes' : 'Show notes')
    if (this.dock) {
      this.dock.inert = !isOpen
      this.dock.setAttribute('aria-hidden', String(!isOpen))
    }
  }

  updateNotes() {
    if (!this.content) {
      return
    }

    const slide = document.querySelector('main > aside.is-focused')
    const notes = slide?.querySelectorAll(':scope > .grid > .content > aside') || []
    const copies = Array.from(notes, (note) => {
      const copy = note.cloneNode(true)
      copy.removeAttribute('id')
      for (const element of copy.querySelectorAll('[id]')) {
        element.removeAttribute('id')
      }
      return copy
    })
    this.content.replaceChildren(...copies)
  }
}

if (!customElements.get('presentation-notes')) {
  customElements.define('presentation-notes', PresentationNotes)
}
