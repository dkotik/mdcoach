<script>
// ============== debounce.js =====================

function debounce(callback, delay = 0) {
  let timeoutId;

  return function (...args) {
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
      timeoutId = undefined;
      callback.apply(this, args);
    }, Math.max(10, delay));
  };
}
const svgNamespace = 'http://www.w3.org/2000/svg'

const element = (name, attributes = {}) => {
  const node = document.createElementNS(svgNamespace, name)
  for (const [attribute, value] of Object.entries(attributes)) {
    node.setAttribute(attribute, value)
  }
  return node
}
// use as <keystroke-combo timeout="1000">; timeout is in milliseconds

const keyStrokeCompleteEventType = "keystroke-combo-complete"

class KeystrokeCombo extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.keys = []
    this.recording = false
    this.timeout = undefined
    this.onClick = this.onClick.bind(this)
    this.onKeyDown = this.onKeyDown.bind(this)
    this.finishRecording = this.finishRecording.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        cursor: text;
        display: inline-flex;
        max-width: 100%;
      }

      :host(:focus-visible) output {
        outline: 2px solid var(--color-marker-background, #006eff);
        outline-offset: 2px;
      }

      output {
        align-items: center;
        background: var(--color-menu-background, #eee);
        border: 1px solid var(--color-menu-text, #666);
        border-radius: 0.25rem;
        color: var(--color-menu-text, #666);
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        min-height: 1.5rem;
        min-width: 6rem;
        padding: 0.25rem 0.5rem;
      }

      :host([recording]) output {
        border-color: var(--color-marker-background, #006eff);
      }

      kbd {
        background: var(--color-body-background, white);
        border: 1px solid currentColor;
        border-radius: 0.2rem;
        font: inherit;
        padding: 0.05rem 0.3rem;
      }

      .separator,
      .placeholder {
        opacity: 0.65;
      }
    `

    const pattern = this.getAttribute('filter')
    if (pattern === null) {
      this.matchesFilter = (key) => true
    } else {
      const filter = new RegExp(pattern)
      this.matchesFilter = (key) => filter.test(key)
    }

    this.output = document.createElement('output')
    this.output.setAttribute('aria-live', 'polite')
    this.shadowRoot.replaceChildren(style, this.output)

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'group')
    }
    if (!this.hasAttribute('aria-label')) {
      this.setAttribute('aria-label', 'Keystroke sequence recorder')
    }
    if (!this.hasAttribute('tabindex')) {
      this.setAttribute('tabindex', '0')
    }

    this.addEventListener('click', this.onClick)
    window.addEventListener('keydown', this.onKeyDown)
    this.renderKeys()
  }

  disconnectedCallback() {
    window.clearTimeout(this.timeout)
    this.timeout = undefined
    this.recording = false
    this.removeAttribute('recording')
    this.removeEventListener('click', this.onClick)
    window.removeEventListener('keydown', this.onKeyDown)
  }

  onClick() {
    this.focus({ preventScroll: true })
  }

  onKeyDown(event) {
    if (event.repeat || event.isComposing || !this.matchesFilter(event.key)) {
      return
    }

    const key = event.key === ' ' ? 'Space' : event.key
    if (!key) {
      return
    }

    event.preventDefault()
    event.stopPropagation()

    if (!this.recording) {
      this.keys = []
      this.recording = true
      this.setAttribute('recording', '')
    }

    this.keys.push(key)
    this.renderKeys()
    window.clearTimeout(this.timeout)
    this.timeout = window.setTimeout(
      this.finishRecording,
      this.getTimeoutDuration(),
    )
  }

  getTimeoutDuration() {
    const value = this.getAttribute('timeout')
    if (value === null) {
      return 1000
    }

    const duration = Number(value)
    return Number.isFinite(duration) && duration >= 0 ? duration : 1000
  }

  renderKeys() {
    if (this.keys.length === 0) {
      const placeholder = document.createElement('span')
      placeholder.className = 'placeholder'
      placeholder.textContent = this.getAttribute('placeholder') || 'Press keys'
      this.output.replaceChildren(placeholder)
      return
    }

    const contents = []
    for (const [index, key] of this.keys.entries()) {
      // if (index > 0) {
      //   const separator = document.createElement('span')
      //   separator.className = 'separator'
      //   separator.textContent = '→'
      //   contents.push(separator)
      // }
      const keycap = document.createElement('kbd')
      keycap.textContent = key
      contents.push(keycap)
    }
    this.output.replaceChildren(...contents)
  }

  finishRecording() {
    if (!this.recording) {
      return
    }

    this.recording = false
    this.timeout = undefined
    this.removeAttribute('recording')
    this.dispatchEvent(new CustomEvent(
      keyStrokeCompleteEventType, {
      bubbles: true,
      composed: true,
      detail: this.keys.join(' '),
    }))
  }
}

if (!customElements.get('keystroke-combo')) {
  customElements.define('keystroke-combo', KeystrokeCombo)
}
// use as custom element <presentation-menu> around presentation controls

class PresentationMenu extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onMouseMove = this.onMouseMove.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        display: block;
        left: 50%;
        position: fixed;
        top: 0;
        transform: translate(-50%, -100%);
        transition: transform 220ms ease;
        z-index: 1000;
      }

      :host([open]) {
        transform: translate(-50%, 0);
      }

      nav {
        align-items: center;
        background: var(--color-menu-background, #eee);
        border-radius: 0 0 0.5rem 0.5rem;
        box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 20%);
        box-sizing: border-box;
        color: var(--color-menu-text, #666);
        display: flex;
        gap: 0.5rem;
        max-width: calc(100vw - 1rem);
        padding: 0.5rem;
      }

      @media (prefers-reduced-motion: reduce) {
        :host {
          transition: none;
        }
      }
    `

    this.navigation = document.createElement('nav')
    this.navigation.setAttribute('aria-label', this.getAttribute('label') || 'Presentation menu')
    const slot = document.createElement('slot')
    this.navigation.append(slot)
    this.shadowRoot.replaceChildren(style, this.navigation)

    this.updateVisibility(this.hasAttribute('open'))
    window.addEventListener('mousemove', this.onMouseMove, { passive: true })
  }

  disconnectedCallback() {
    window.removeEventListener('mousemove', this.onMouseMove)
  }

  onMouseMove(event) {
    const revealBoundary = window.innerHeight * 0.15
    const shouldOpen = event.clientY <= revealBoundary || this.matches(':hover')
    this.updateVisibility(shouldOpen)
  }

  updateVisibility(isVisible) {
    this.toggleAttribute('open', isVisible)
    if (!this.navigation) {
      return
    }

    this.navigation.inert = !isVisible
    this.navigation.setAttribute('aria-hidden', String(!isVisible))
  }
}

if (!customElements.get('presentation-menu')) {
  customElements.define('presentation-menu', PresentationMenu)
}
// use as <presentation-side-button side="left|right"> around side controls

class PresentationSideButton extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onMouseMove = this.onMouseMove.bind(this)
  }

  connectedCallback() {
    if (this.getAttribute('side') !== 'right') {
      this.setAttribute('side', 'left')
    }

    const style = document.createElement('style')
    style.textContent = `
      :host {
        display: block;
        position: fixed;
        top: 50%;
        transition: transform 220ms ease;
        z-index: 1000;
        cursor: pointer;
      }

      :host([side="left"]) {
        left: 0;
        transform: translate(-100%, -50%);
      }

      :host([side="left"][open]) {
        transform: translate(0, -50%);
      }

      :host([side="right"]) {
        right: 0;
        transform: translate(100%, -50%);
      }

      :host([side="right"][open]) {
        transform: translate(0, -50%);
      }

      aside {
        align-items: center;
        background: var(--color-menu-background, #eee);
        box-shadow: 0 0.25rem 1rem rgb(0 0 0 / 20%);
        box-sizing: border-box;
        color: var(--color-menu-text, #666);
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-height: calc(100vh - 2rem);
        overflow: auto;
        padding: 0.5rem;
      }

      :host([side="left"]) aside {
        border-radius: 0 0.5rem 0.5rem 0;
      }

      :host([side="right"]) aside {
        border-radius: 0.5rem 0 0 0.5rem;
      }

      @media (prefers-reduced-motion: reduce) {
        :host {
          transition: none;
        }
      }
    `

    this.panel = document.createElement('aside')
    this.panel.setAttribute('aria-label', this.getAttribute('label') || 'Presentation side controls')
    this.panel.append(document.createElement('slot'))
    this.shadowRoot.replaceChildren(style, this.panel)

    this.updateVisibility(this.hasAttribute('open'))
    window.addEventListener('mousemove', this.onMouseMove, { passive: true })
  }

  disconnectedCallback() {
    window.removeEventListener('mousemove', this.onMouseMove)
  }

  onMouseMove(event) {
    const edgeDistance = window.innerWidth * 0.15
    const nearDock = this.getAttribute('side') === 'right'
      ? event.clientX >= window.innerWidth - edgeDistance
      : event.clientX <= edgeDistance
    const shouldOpen = nearDock || this.matches(':hover') || this.matches(':focus-within')
    this.updateVisibility(shouldOpen)
  }

  updateVisibility(isVisible) {
    this.toggleAttribute('open', isVisible)
    if (!this.panel) {
      return
    }

    this.panel.inert = !isVisible
    this.panel.setAttribute('aria-hidden', String(!isVisible))
  }
}

if (!customElements.get('presentation-side-button')) {
  customElements.define('presentation-side-button', PresentationSideButton)
}
// use as custom element <dark-light-toggle> around document-provided content

class DarkLightToggle extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onClick = this.onClick.bind(this)
    this.onKeyDown = this.onKeyDown.bind(this)
  }

  connectedCallback() {
    this.darkMode = window.localStorage.getItem('darkMode') === 'true'
    this.applyTheme()

    const style = document.createElement('style')
    style.textContent = `
      :host {
        align-items: center;
        cursor: pointer;
        display: inline-flex;
      }

      ::slotted(svg) {
        fill: currentColor;
        height: 1em;
        margin-inline-start: 0.4em;
        width: 1em;
      }

      :host(:focus-visible) {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
    `

    this.shadowRoot.replaceChildren(style, document.createElement('slot'))

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'button')
    }
    if (!this.hasAttribute('tabindex')) {
      this.setAttribute('tabindex', '0')
    }

    this.addEventListener('click', this.onClick)
    this.addEventListener('keydown', this.onKeyDown)
    this.updatePressedState()
  }

  disconnectedCallback() {
    this.removeEventListener('click', this.onClick)
    this.removeEventListener('keydown', this.onKeyDown)
  }

  applyTheme() {
    document.documentElement.dataset.theme = this.darkMode ? 'dark' : 'light'
  }

  updatePressedState() {
    this.setAttribute('aria-pressed', String(this.darkMode))
  }

  onClick() {
    this.toggle()
  }

  onKeyDown(event) {
    if (event.code !== 'Enter' && event.code !== 'Space') {
      return
    }

    event.preventDefault()
    this.toggle()
  }

  toggle() {
    this.darkMode = !this.darkMode
    if (this.darkMode) {
      window.localStorage.setItem('darkMode', 'true')
    } else {
      window.localStorage.removeItem('darkMode')
    }
    this.applyTheme()
    this.updatePressedState()
  }
}

if (!customElements.get('dark-light-toggle')) {
  customElements.define('dark-light-toggle', DarkLightToggle)
}
// use as custom element <fullscreen-toggle> with its label as text content

class FullscreenToggle extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onKeyDown = this.onKeyDown.bind(this)
    this.onActivateKeyDown = this.onActivateKeyDown.bind(this)
    this.updateState = this.updateState.bind(this)
    this.onClick = this.onClick.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        cursor: pointer;
        display: inline-block;
      }

      :host([fullscreen]) {
        color: red;
      }
    `

    const slot = document.createElement('slot')
    this.shadowRoot.replaceChildren(style, slot)

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'button')
    }
    if (!this.hasAttribute('tabindex')) {
      this.setAttribute('tabindex', '0')
    }

    this.addEventListener('click', this.onClick)
    this.addEventListener('keydown', this.onActivateKeyDown)
    document.addEventListener('keydown', this.onKeyDown)
    document.addEventListener('fullscreenchange', this.updateState)
    document.addEventListener('webkitfullscreenchange', this.updateState)
    this.updateState()
  }

  disconnectedCallback() {
    this.removeEventListener('click', this.onClick)
    this.removeEventListener('keydown', this.onActivateKeyDown)
    document.removeEventListener('keydown', this.onKeyDown)
    document.removeEventListener('fullscreenchange', this.updateState)
    document.removeEventListener('webkitfullscreenchange', this.updateState)
  }

  onClick() {
    this.toggleFullscreen()
  }

  onActivateKeyDown(event) {
    if (
      (event.code !== 'Enter' && event.code !== 'Space') ||
      this.isEditableTarget(event.target)
    ) {
      return
    }

    event.preventDefault()
    this.toggleFullscreen()
  }

  onKeyDown(event) {
    if (
      event.code !== 'KeyF' ||
      event.altKey ||
      event.ctrlKey ||
      event.metaKey ||
      event.shiftKey ||
      this.isEditableTarget(event.target)
    ) {
      return
    }

    event.preventDefault()
    this.toggleFullscreen()
  }

  isEditableTarget(target) {
    return target instanceof Element && (
      target.isContentEditable ||
      target.matches('input, textarea, select')
    )
  }

  isFullscreen() {
    return Boolean(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.fullScreenElement ||
      document.webkitIsFullScreen
    )
  }

  async toggleFullscreen() {
    try {
      if (this.isFullscreen()) {
        const exit =
          document.exitFullscreen ||
          document.exitFullScreen ||
          document.cancelFullScreen ||
          document.webkitCancelFullScreen
        if (exit) {
          await exit.call(document)
        }
        return
      }

      const root = document.documentElement
      const request =
        root.requestFullscreen ||
        root.requestFullScreen ||
        root.webkitRequestFullScreen
      if (request) {
        await request.call(root)
      }
    } catch (error) {
      this.dispatchEvent(new CustomEvent('fullscreenerror', {
        bubbles: true,
        composed: true,
        detail: error,
      }))
    }
  }

  updateState() {
    const fullscreen = this.isFullscreen()
    this.toggleAttribute('fullscreen', fullscreen)
    this.setAttribute('aria-pressed', String(fullscreen))
  }
}

if (!customElements.get('fullscreen-toggle')) {
  customElements.define('fullscreen-toggle', FullscreenToggle)
}
// use as custom element <clock> anywhere on the page

class PresentationClock extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
  }

  connectedCallback() {
    window.clearInterval(this.timer)

    const style = document.createElement('style')
    style.textContent = `
      :host {
        display: block;
        width: 100%;
        height: 100%;
      }

      svg {
        width: 100%;
        height: 100%;
      }

      .clock-face { stroke: #333; fill: white; }
      .minor { stroke: #999; stroke-width: 0.5; }
      .major { stroke: #333; stroke-width: 1; }
      .hour { stroke: #333; }
      .minute { stroke: #666; }
      .second, .second-counterweight { stroke: rgb(180, 0, 0); }
      .second-counterweight { stroke-width: 3; }
    `

    this.svg = element('svg', { viewBox: '-50 -50 100 100' })
    this.svg.append(element('circle', { class: 'clock-face', r: '48' }))

    for (let minute = 0; minute < 60; minute += 5) {
      this.svg.append(element('line', {
        class: 'major',
        y1: '35',
        y2: '45',
        transform: `rotate(${6 * minute})`,
      }))

      for (let offset = 1; offset <= 4; offset++) {
        this.svg.append(element('line', {
          class: 'minor',
          y1: '42',
          y2: '45',
          transform: `rotate(${6 * (minute + offset)})`,
        }))
      }
    }

    this.hourHand = element('line', { class: 'hour', y1: '2', y2: '-20' })
    this.minuteHand = element('line', { class: 'minute', y1: '4', y2: '-30' })
    this.secondHand = element('g')
    this.secondHand.append(
      element('line', { class: 'second', y1: '10', y2: '-38' }),
      element('line', { class: 'second-counterweight', y1: '10', y2: '2' }),
    )
    this.svg.append(this.hourHand, this.minuteHand, this.secondHand)
    this.shadowRoot.replaceChildren(style, this.svg)

    this.updateTime()
    this.timer = window.setInterval(() => this.updateTime(), 1000)
  }

  disconnectedCallback() {
    window.clearInterval(this.timer)
    this.timer = undefined
  }

  updateTime() {
    const time = new Date()
    const hours = time.getHours()
    const minutes = time.getMinutes()
    const seconds = time.getSeconds()

    this.hourHand.setAttribute('transform', `rotate(${30 * hours + minutes / 2})`)
    this.minuteHand.setAttribute('transform', `rotate(${6 * minutes + seconds / 10})`)
    this.secondHand.setAttribute('transform', `rotate(${6 * seconds})`)
  }
}

if (!customElements.get('presentation-clock')) {
  customElements.define('presentation-clock', PresentationClock)
}
// use as <presentation-timer duration="60">; duration is in seconds

const presentationTimerTickEventType = 'presentation-timer-tick'

class PresentationTimer extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.elapsed = 0
    this.running = false
    this.frame = undefined
    this.startedAt = 0
    this.lastDispatchedSecond = 0
    this.onClick = this.onClick.bind(this)
    this.onKeyDown = this.onKeyDown.bind(this)
    this.tick = this.tick.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        cursor: pointer;
        display: block;
        height: 100%;
        width: 100%;
      }

      :host(:focus-visible) {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }

      svg {
        height: 100%;
        width: 100%;
      }

      .track {
        fill: none;
        stroke: var(--color-body-subtext, #aaa);
        stroke-opacity: 0.35;
        stroke-width: 16;
      }

      .progress {
        fill: none;
        stroke: var(--color-marker-background, #006eff);
        stroke-linecap: round;
        stroke-width: 16;
        transition: stroke-opacity 150ms ease;
      }

      :host([paused]) .progress {
        stroke-opacity: 0.3;
      }

      @media (prefers-reduced-motion: reduce) {
        .progress {
          stroke-linecap: butt;
        }
      }
    `

    this.duration = this.getDuration()
    this.circumference = 2 * Math.PI * 42
    this.svg = element('svg', { viewBox: '0 0 100 100', 'aria-hidden': 'true' })
    this.trackCircle = element('circle', {
      class: 'track',
      cx: '50',
      cy: '50',
      r: '36',
    })
    this.progressCircle = element('circle', {
      class: 'progress',
      cx: '50',
      cy: '50',
      r: '36',
      transform: 'rotate(-90 50 50)',
      'stroke-dasharray': String(this.circumference),
      'stroke-dashoffset': String(this.circumference),
    })
    this.svg.append(this.trackCircle, this.progressCircle)
    this.shadowRoot.replaceChildren(style, this.svg)

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'button')
    }
    if (!this.hasAttribute('tabindex')) {
      this.setAttribute('tabindex', '0')
    }

    this.setAttribute('aria-label', `${this.duration / 1000} second timer`)
    this.addEventListener('click', this.onClick)
    this.addEventListener('keydown', this.onKeyDown)
    this.updateProgress(this.elapsed)
    this.updateState()
  }

  disconnectedCallback() {
    this.pause()
    this.removeEventListener('click', this.onClick)
    this.removeEventListener('keydown', this.onKeyDown)
  }

  getDuration() {
    const seconds = Number(this.getAttribute('duration'))
    return Number.isFinite(seconds) && seconds > 0 ? seconds * 1000 : 60_000
  }

  onClick() {
    if (this.running) {
      this.pause()
    } else {
      this.start()
    }
  }

  onKeyDown(event) {
    if ((event.code !== 'Enter' && event.code !== 'Space') || event.repeat) {
      return
    }

    event.preventDefault()
    this.onClick()
  }

  start() {
    if (this.elapsed >= this.duration) {
      this.elapsed = 0
    }

    this.startedAt = performance.now()
    this.lastDispatchedSecond = Math.floor(this.elapsed / 1000)
    this.running = true
    this.updateProgress(this.elapsed)
    this.updateState()
    this.frame = window.requestAnimationFrame(this.tick)
  }

  pause() {
    if (!this.running) {
      return
    }

    this.elapsed = Math.min(
      this.duration,
      this.elapsed + performance.now() - this.startedAt,
    )
    this.running = false
    window.cancelAnimationFrame(this.frame)
    this.frame = undefined
    this.updateProgress(this.elapsed)
    this.updateState()
  }

  tick(timestamp) {
    if (!this.running) {
      return
    }

    const elapsed = this.elapsed + timestamp - this.startedAt
    this.dispatchElapsedSeconds(elapsed)
    if (elapsed >= this.duration) {
      this.elapsed = this.duration
      if (this.duration % 1000 !== 0) {
        this.dispatchTimerTick(this.duration)
      }
      this.running = false
      this.frame = undefined
      this.updateProgress(this.elapsed)
      this.updateState()
      return
    }

    this.updateProgress(elapsed)
    this.frame = window.requestAnimationFrame(this.tick)
  }

  dispatchElapsedSeconds(elapsed) {
    const elapsedSeconds = Math.floor(elapsed / 1000)
    while (this.lastDispatchedSecond < elapsedSeconds) {
      this.lastDispatchedSecond++
      this.dispatchTimerTick(Math.min(this.lastDispatchedSecond * 1000, this.duration))
    }
  }

  dispatchTimerTick(elapsed) {
    this.dispatchEvent(new CustomEvent(presentationTimerTickEventType, {
      bubbles: true,
      composed: true,
      detail: {
        totalDuration: this.duration,
        remainingDuration: Math.max(0, this.duration - elapsed),
      },
    }))
  }

  updateProgress(elapsed) {
    const progress = Math.min(elapsed / this.duration, 1)
    this.progressCircle.setAttribute(
      'stroke-dashoffset',
      String(this.circumference * (1 - progress)),
    )
  }

  updateState() {
    this.toggleAttribute('paused', !this.running)
    this.setAttribute('aria-pressed', String(this.running))
    this.setAttribute(
      'aria-label',
      `${this.running ? 'Pause' : 'Start'} ${this.duration / 1000} second timer`,
    )
  }
}

if (!customElements.get('presentation-timer')) {
  customElements.define('presentation-timer', PresentationTimer)
}
// use as <timer-set duration="300">; duration is in seconds
// emits 'presentation-timer-change' with the selected duration in seconds

class TimerSet extends HTMLElement {
  static get observedAttributes() {
    return ['data-timer-id']
  }

  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onClick = this.onClick.bind(this)
    this.onInputChange = this.onInputChange.bind(this)
    this.onInputKeyDown = this.onInputKeyDown.bind(this)
    this.onInputBlur = this.onInputBlur.bind(this)
    this.onTimerTick = this.onTimerTick.bind(this)
    this.defaultDuration = 60
    this.duration = this.defaultDuration
    this.timerElement = null
  }

  connectedCallback() {
    this.updateTimerTickSubscription()
    this.defaultDuration = this.getDurationAttribute()
    this.duration = this.defaultDuration

    const style = document.createElement('style')
    style.textContent = `
      :host {
        color: var(--color-menu-text, #666);
        display: inline-flex;
        max-width: 100%;
      }

      .controls {
        align-items: center;
        display: flex;
        gap: 0.5rem;
      }

      .group {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      button {
        background: var(--color-menu-background, #eee);
        border: 1px solid var(--color-body-subtext, #aaa);
        border-radius: 0.3rem;
        color: inherit;
        cursor: pointer;
        font: inherit;
        line-height: 1.2;
        padding: 0.3rem 0.5rem;
        white-space: nowrap;
      }

      button:hover {
        border-color: var(--color-marker-background, #006eff);
      }

      button:focus-visible {
        outline: 2px solid var(--color-marker-background, #006eff);
        outline-offset: 2px;
      }

      .duration-input {
        background: var(--color-menu-background, #eee);
        border: 1px solid var(--color-body-subtext, #aaa);
        border-radius: 0.35rem;
        box-sizing: content-box;
        color: inherit;
        font: inherit;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        padding: 0.45rem 0.6rem;
        text-align: center;
        width: 5ch;
      }

      .duration-input:focus-visible {
        outline: 2px solid var(--color-marker-background, #006eff);
        outline-offset: 2px;
      }

      @media (max-width: 30rem) {
        .controls {
          gap: 0.25rem;
        }

        button {
          font-size: 0.8rem;
          padding: 0.3rem;
        }
      }
    `

    this.input = document.createElement('input')
    this.input.className = 'duration-input'
    this.input.type = 'text'
    this.input.setAttribute('aria-label', 'Timer duration in minutes and seconds')
    this.input.setAttribute('autocomplete', 'off')
    this.input.addEventListener('change', this.onInputChange)
    this.input.addEventListener('keydown', this.onInputKeyDown)
    this.input.addEventListener('blur', this.onInputBlur)

    const addButtons = document.createElement('div')
    addButtons.className = 'group'
    addButtons.append(
      this.createButton('Add 1 minute', '+1 min', 60),
      this.createButton('Add 5 minutes', '+5 min', 300),
    )

    const otherButtons = document.createElement('div')
    otherButtons.className = 'group'
    otherButtons.append(
      this.createButton('Reset timer', 'Reset', 'reset'),
      this.createButton('Subtract 30 seconds', '−30 sec', -30),
    )

    const controls = document.createElement('div')
    controls.className = 'controls'
    controls.append(addButtons, this.input, otherButtons)
    this.shadowRoot.replaceChildren(style, controls)
    this.shadowRoot.addEventListener('click', this.onClick)
    this.renderDuration()
  }

  disconnectedCallback() {
    this.shadowRoot.removeEventListener('click', this.onClick)
    this.input?.removeEventListener('change', this.onInputChange)
    this.input?.removeEventListener('keydown', this.onInputKeyDown)
    this.input?.removeEventListener('blur', this.onInputBlur)
    this.removeTimerTickSubscription()
  }

  attributeChangedCallback(name, oldValue, newValue) {
    if (name === 'data-timer-id' && oldValue !== newValue && this.isConnected) {
      this.updateTimerTickSubscription()
    }
  }

  updateTimerTickSubscription() {
    this.removeTimerTickSubscription()

    const timerId = this.getAttribute('data-timer-id')
    if (!timerId) {
      return
    }

    this.timerElement = document.getElementById(timerId)
    this.timerElement?.addEventListener(presentationTimerTickEventType, this.onTimerTick)
  }

  removeTimerTickSubscription() {
    this.timerElement?.removeEventListener(presentationTimerTickEventType, this.onTimerTick)
    this.timerElement = null
  }

  onInputKeyDown(event) {
    if (event.key !== 'Enter') {
      return
    }

    event.preventDefault()
    this.onInputChange()
    this.input.blur()
    this.renderDuration()
  }

  onInputChange() {
    const duration = this.parseDuration(this.input.value)
    if (duration === null) {
      return
    }

    this.duration = duration
    this.updateTimerDuration()
  }

  onInputBlur() {
    this.renderDuration()
  }

  parseDuration(value) {
    const match = /^(\d+):([0-5]?\d)$/.exec(value.trim())
    if (!match) {
      return null
    }

    const minutes = Number(match[1])
    const seconds = Number(match[2])
    const duration = minutes * 60 + seconds
    return Number.isSafeInteger(duration) ? duration : null
  }

  onTimerTick(event) {
    if (event.currentTarget !== this.timerElement) {
      return
    }

    const remainingDuration = Number(event.detail?.remainingDuration)
    if (!Number.isFinite(remainingDuration) || remainingDuration < 0) {
      return
    }

    this.duration = Math.ceil(remainingDuration / 1000)
    this.renderDuration()
  }

  getDurationAttribute() {
    if (this.timerElement) {
      const timerDuration = Number(this.timerElement.duration)
      if (Number.isFinite(timerDuration) && timerDuration >= 0) {
        return Math.floor(timerDuration / 1000)
      }
    }

    const value = Number(this.getAttribute('duration'))
    return Number.isFinite(value) && value >= 0 ? Math.floor(value) : 60
  }

  createButton(label, text, adjustment) {
    const button = document.createElement('button')
    button.type = 'button'
    button.textContent = text
    button.setAttribute('aria-label', label)
    button.dataset.adjustment = String(adjustment)
    return button
  }

  onClick(event) {
    const button = event.target.closest('button[data-adjustment]')
    if (!button) {
      return
    }

    const adjustment = button.dataset.adjustment
    if (adjustment === 'reset') {
      this.duration = this.defaultDuration
    } else {
      this.duration = Math.max(0, this.duration + Number(adjustment))
    }
    this.renderDuration()
    this.updateTimerDuration()
  }

  updateTimerDuration() {
    if (this.timerElement) {
      this.timerElement.duration = this.duration * 1000
    }
  }

  renderDuration() {
    if (!this.input || this.shadowRoot.activeElement === this.input) {
      return
    }

    const minutes = Math.floor(this.duration / 60)
    const seconds = this.duration % 60
    this.input.value = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`
    this.input.setAttribute('aria-valuetext', `${minutes} minutes ${seconds} seconds`)
  }
}

if (!customElements.get('timer-set')) {
  customElements.define('timer-set', TimerSet)
}
// use as <mouse-proximity distance="100"> to reveal slotted content near the pointer

const mouseProximityDefaultDistance = 100

class MouseProximity extends HTMLElement {
  static get observedAttributes() {
    return ['distance']
  }

  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onPointerMove = this.onPointerMove.bind(this)
    this.onPointerOut = this.onPointerOut.bind(this)
    this.pointerX = undefined
    this.pointerY = undefined
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        display: inline-block;
      }

      .content {
        visibility: hidden;
      }

      :host([revealed]) .content {
        visibility: visible;
      }
    `

    this.content = document.createElement('span')
    this.content.className = 'content'
    this.content.append(document.createElement('slot'))
    this.shadowRoot.replaceChildren(style, this.content)
    this.updateState()
    window.addEventListener('pointermove', this.onPointerMove)
    window.addEventListener('pointerout', this.onPointerOut)
  }

  disconnectedCallback() {
    window.removeEventListener('pointermove', this.onPointerMove)
    window.removeEventListener('pointerout', this.onPointerOut)
  }

  attributeChangedCallback(name, oldValue, newValue) {
    if (name !== 'distance' || oldValue === newValue || !this.isConnected) {
      return
    }

    this.updateRevealState()
  }

  getDistance() {
    const distance = Number(this.getAttribute('distance'))
    return Number.isFinite(distance) && distance >= 0
      ? distance
      : mouseProximityDefaultDistance
  }

  onPointerMove(event) {
    this.pointerX = event.clientX
    this.pointerY = event.clientY
    this.updateRevealState()
  }

  onPointerOut(event) {
    if (event.relatedTarget) {
      return
    }

    this.pointerX = undefined
    this.pointerY = undefined
    this.removeAttribute('revealed')
    this.updateState()
  }

  updateRevealState() {
    if (this.pointerX === undefined || this.pointerY === undefined) {
      return
    }

    const bounds = this.getBoundingClientRect()
    const horizontalDistance = Math.max(bounds.left - this.pointerX, 0, this.pointerX - bounds.right)
    const verticalDistance = Math.max(bounds.top - this.pointerY, 0, this.pointerY - bounds.bottom)
    this.toggleAttribute(
      'revealed',
      Math.hypot(horizontalDistance, verticalDistance) <= this.getDistance(),
    )
    this.updateState()
  }

  updateState() {
    this.setAttribute('aria-hidden', String(!this.hasAttribute('revealed')))
  }
}

if (!customElements.get('mouse-proximity')) {
  customElements.define('mouse-proximity', MouseProximity)
}
// use as custom element <presentation-progress> for slide navigation progress

class PresentationProgress extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onNavigationComplete = this.onNavigationComplete.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        bottom: 0;
        display: block;
        height: 0.25rem;
        left: 0;
        pointer-events: none;
        position: fixed;
        width: 100vw;
        z-index: 10000;
        background: var(--color-body-subtext, #aaa);
      }


      .fill {
        background: var(--color-marker-background, #006eff);
        height: 100%;
        transition: width 600ms ease;
        width: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .fill {
          transition: none;
        }
      }
    `

    this.setAttribute('role', 'progressbar')
    this.setAttribute('aria-label', 'Presentation progress')
    this.setAttribute('aria-valuemin', '0')
    this.setAttribute('aria-valuemax', '100')

    this.fill = document.createElement('div')
    this.fill.className = 'fill'
    this.shadowRoot.replaceChildren(style, this.fill)

    this.updateProgress(0)
    window.addEventListener('slideNavigationFinished', this.onNavigationComplete)
  }

  disconnectedCallback() {
    window.removeEventListener('slideNavigationFinished', this.onNavigationComplete)
  }

  onNavigationComplete(event) {
    const { slideIndex, finalSlideIndex: finalSlideIndex } = event.detail
    if (!Number.isInteger(slideIndex) || !Number.isInteger(finalSlideIndex)) {
      return
    }

    const progress = finalSlideIndex > 0
      ? (slideIndex / finalSlideIndex) * 100
      : 100
    // console.log("got event", event.detail)
    this.updateProgress(Math.min(100, Math.max(0, progress)))
  }

  updateProgress(percentage) {
    this.fill.style.width = `${percentage}%`
    this.setAttribute('aria-valuenow', String(Math.round(percentage)))
    // console.log("progress:", percentage)
  }
}

if (!customElements.get('presentation-progress')) {
  customElements.define('presentation-progress', PresentationProgress)
}
// use as <presentation-play> to present slides on a connected external display

const presentationPlayReceiverParameter = 'presentation-receiver'
const presentationPlayMessageType = 'presentation-slide-state'

class PresentationPlay extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onClick = this.onClick.bind(this)
    this.onConnectionAvailable = this.onConnectionAvailable.bind(this)
    this.onConnectionStateChange = this.onConnectionStateChange.bind(this)
    this.onConnectionError = this.onConnectionError.bind(this)
    this.onNavigationComplete = this.onNavigationComplete.bind(this)
    this.onReceiverConnectionAvailable = this.onReceiverConnectionAvailable.bind(this)
    this.onReceiverMessage = this.onReceiverMessage.bind(this)
    this.onDOMReady = this.onDOMReady.bind(this)
    this.connection = undefined
    this.isStarting = false
    this.isDOMReady = document.readyState !== 'loading'
    this.pendingState = undefined
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        display: inline-block;
      }

      :host([hidden]) {
        display: none;
      }

      button {
        background: var(--color-menu-background, #eee);
        border: 1px solid var(--color-body-subtext, #aaa);
        border-radius: 0.35rem;
        color: var(--color-menu-text, #666);
        cursor: pointer;
        font: inherit;
        padding: 0.5rem 0.75rem;
        white-space: nowrap;
      }

      button:hover:not(:disabled) {
        border-color: var(--color-marker-background, #006eff);
      }

      button:focus-visible {
        outline: 2px solid var(--color-marker-background, #006eff);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }
    `

    this.button = document.createElement('button')
    this.button.type = 'button'
    this.button.textContent = 'Present'
    this.button.setAttribute('aria-label', 'Present on an external display')
    this.button.addEventListener('click', this.onClick)
    this.shadowRoot.replaceChildren(style, this.button)

    const receiverMode = new URL(window.location.href).searchParams.has(
      presentationPlayReceiverParameter,
    )
    if (receiverMode) {
      this.enterReceiverMode()
      return
    }

    this.setupPresentationRequest()
    window.addEventListener('slideNavigationFinished', this.onNavigationComplete)
  }

  disconnectedCallback() {
    this.button?.removeEventListener('click', this.onClick)
    window.removeEventListener('slideNavigationFinished', this.onNavigationComplete)
    this.request?.removeEventListener('connectionavailable', this.onConnectionAvailable)
    document.removeEventListener('DOMContentLoaded', this.onDOMReady)

    if (this.receiverConnectionList) {
      this.receiverConnectionList.removeEventListener(
        'connectionavailable',
        this.onReceiverConnectionAvailable,
      )
    }

    for (const connection of this.receiverConnections || []) {
      connection.removeEventListener('message', this.onReceiverMessage)
    }
  }

  setupPresentationRequest() {
    if (typeof window.PresentationRequest !== 'function') {
      this.button.disabled = true
      this.button.title = 'Presentation API is not supported by this browser.'
      return
    }

    const url = new URL(this.getAttribute('url') || window.location.href, window.location.href)
    url.searchParams.set(presentationPlayReceiverParameter, '1')
    const slides = Array.from(document.querySelectorAll('main > section'))
    const focusedSlideIndex = slides.findIndex((slide) => slide.classList.contains('is-focused'))
    if (focusedSlideIndex >= 0) {
      url.hash = String(focusedSlideIndex + 1)
    }

    try {
      this.request = new window.PresentationRequest([url.href])
      this.request.addEventListener('connectionavailable', this.onConnectionAvailable)
    } catch (error) {
      this.button.disabled = true
      this.button.title = 'Unable to create a presentation request.'
      this.dispatchError(error)
    }
  }

  async onClick() {
    if (this.isStarting) {
      return
    }

    if (this.connection?.state === 'connected') {
      try {
        this.connection.terminate()
      } catch (error) {
        this.dispatchError(error)
      }
      return
    }

    if (!this.request) {
      return
    }

    this.isStarting = true
    this.updateButton()
    try {
      const connection = await this.request.start()
      this.attachSenderConnection(connection)
    } catch (error) {
      this.dispatchError(error)
    } finally {
      this.isStarting = false
      this.updateButton()
    }
  }

  onConnectionAvailable(event) {
    this.attachSenderConnection(event.connection)
  }

  attachSenderConnection(connection) {
    if (this.connection === connection) {
      return
    }

    this.connection = connection
    connection.addEventListener('connect', this.onConnectionStateChange)
    connection.addEventListener('close', this.onConnectionStateChange)
    connection.addEventListener('terminate', this.onConnectionStateChange)
    connection.addEventListener('statechange', this.onConnectionStateChange)
    connection.addEventListener('error', this.onConnectionError)
    this.updateButton()
    this.sendCurrentState()
  }

  onConnectionStateChange(event) {
    const connection = event.currentTarget
    if (connection.state === 'closed' || connection.state === 'terminated') {
      if (this.connection === connection) {
        this.connection = undefined
      }
    } else if (connection.state === 'connected') {
      this.sendCurrentState()
    }
    this.updateButton()
  }

  onConnectionError(event) {
    this.dispatchError(event.error || event)
  }

  onNavigationComplete() {
    this.sendCurrentState()
  }

  sendCurrentState() {
    if (this.connection?.state !== 'connected') {
      return
    }

    const slides = Array.from(document.querySelectorAll('main > section'))
    const slideIndex = slides.findIndex((slide) => slide.classList.contains('is-focused'))
    if (slideIndex < 0) {
      return
    }

    const listItems = slides[slideIndex].querySelectorAll(
      ':scope > .grid > .content > ul > li',
    )
    const revealedListItemCount = Array.from(listItems)
      .filter((item) => item.classList.contains('is-revealed'))
      .length

    try {
      this.connection.send(JSON.stringify({
        type: presentationPlayMessageType,
        slideIndex,
        revealedListItemCount,
      }))
    } catch (error) {
      this.dispatchError(error)
    }
  }

  enterReceiverMode() {
    this.hidden = true
    document.documentElement.setAttribute('data-presentation-receiver', '')
    this.addReceiverStyles()

    if (!this.isDOMReady) {
      document.addEventListener('DOMContentLoaded', this.onDOMReady, { once: true })
    }

    const receiver = navigator.presentation?.receiver
    if (!receiver) {
      return
    }

    receiver.connectionList.then((connectionList) => {
      this.receiverConnectionList = connectionList
      for (const connection of connectionList.connections) {
        this.attachReceiverConnection(connection)
      }
      connectionList.addEventListener(
        'connectionavailable',
        this.onReceiverConnectionAvailable,
      )
    }).catch((error) => this.dispatchError(error))
  }

  addReceiverStyles() {
    if (document.getElementById('presentation-receiver-styles')) {
      return
    }

    const style = document.createElement('style')
    style.id = 'presentation-receiver-styles'
    style.textContent = `
      html[data-presentation-receiver] presentation-menu,
      html[data-presentation-receiver] presentation-side-button,
      html[data-presentation-receiver] presentation-play,
      html[data-presentation-receiver] presentation-curtain,
      html[data-presentation-receiver] presentation-timer,
      html[data-presentation-receiver] timer-set,
      html[data-presentation-receiver] keystroke-combo,
      html[data-presentation-receiver] slide-notes {
        display: none !important;
      }

      html[data-presentation-receiver] body {
        cursor: none;
      }
    `
    document.head.append(style)
  }

  onReceiverConnectionAvailable(event) {
    this.attachReceiverConnection(event.connection)
  }

  attachReceiverConnection(connection) {
    this.receiverConnections ||= new Set()
    if (this.receiverConnections.has(connection)) {
      return
    }

    this.receiverConnections.add(connection)
    connection.addEventListener('message', this.onReceiverMessage)
  }

  onReceiverMessage(event) {
    if (typeof event.data !== 'string') {
      return
    }

    let state
    try {
      state = JSON.parse(event.data)
    } catch {
      return
    }
    if (state?.type !== presentationPlayMessageType) {
      return
    }

    this.pendingState = state
    if (this.isDOMReady) {
      this.applyState(state)
    }
  }

  onDOMReady() {
    this.isDOMReady = true
    if (this.pendingState) {
      this.applyState(this.pendingState)
    }
  }

  applyState(state) {
    const slides = Array.from(document.querySelectorAll('main > section'))
    if (!Number.isInteger(state.slideIndex) || state.slideIndex < 0 || state.slideIndex >= slides.length) {
      return
    }

    if (typeof navigate === 'function' && typeof currentSlide === 'number') {
      if (currentSlide !== state.slideIndex) {
        navigate(state.slideIndex)
      }
    } else {
      slides.forEach((slide, index) => {
        slide.classList.toggle('is-focused', index === state.slideIndex)
      })
    }

    const listItems = slides[state.slideIndex].querySelectorAll(
      ':scope > .grid > .content > ul > li',
    )
    const revealedListItemCount = Number.isInteger(state.revealedListItemCount)
      ? Math.min(listItems.length, Math.max(0, state.revealedListItemCount))
      : 0
    Array.from(listItems).forEach((item, index) => {
      item.classList.toggle('is-revealed', index < revealedListItemCount)
    })

    window.dispatchEvent(new CustomEvent('slideNavigationFinished', {
      detail: {
        slideIndex: state.slideIndex,
        finalSlideIndex: slides.length - 1,
        concealedListItemCount: listItems.length - revealedListItemCount,
      },
    }))
  }

  updateButton() {
    if (!this.button) {
      return
    }

    const state = this.connection?.state
    const isConnected = state === 'connected'
    const isConnecting = this.isStarting || state === 'connecting'
    this.button.textContent = isConnecting
      ? 'Connecting…'
      : isConnected
        ? 'Stop presenting'
        : 'Present'
    this.button.disabled = isConnecting || !this.request
    this.button.setAttribute('aria-pressed', String(isConnected))
    this.button.setAttribute('aria-label', isConnected
      ? 'Stop presenting on the external display'
      : 'Present on an external display')
  }

  dispatchError(error) {
    this.dispatchEvent(new CustomEvent('presentationerror', {
      bubbles: true,
      composed: true,
      detail: error,
    }))
  }
}

  customElements.define('presentation-play', PresentationPlay)
}

const resizableTextMinimum = 20

const resizableTextDefault = 100

  static get observedAttributes() {
    return ['data-key']

  constructor() {
    super()

    this.onClick = this.onClick.bind(this)
  }

  connectedCallback() {
    const style = document.createElement('style')
    style.textContent = `
      :host {
        color: var(--color-menu-text, #666);
        display: block;
        max-width: 100%;
      }

      .toolbar {
        align-items: center;
        display: flex;
        gap: 0.4rem;
        margin-bottom: 0.5rem;
      }

      button {
        background: var(--color-menu-background, #eee);
        border: 1px solid var(--color-body-subtext, #aaa);
        border-radius: 0.3rem;
        color: inherit;
        cursor: pointer;
        font: inherit;
        line-height: 1;
        padding: 0.4rem 0.6rem;
      }

      button:hover:not(:disabled) {
        border-color: var(--color-marker-background, #006eff);
      }

      button:focus-visible {
        outline: 2px solid var(--color-marker-background, #006eff);
        outline-offset: 2px;
      }

      button:disabled {
        cursor: default;
        opacity: 0.5;
      }

      output {
        font-variant-numeric: tabular-nums;
        min-width: 4ch;
        text-align: center;
      }

      .content {
        font-size: var(--resizable-text-size, 100%);
      }
    `

    const toolbar = document.createElement('div')
    toolbar.className = 'toolbar'

    this.decreaseButton = this.createButton('Decrease font size', 'A−', -resizableTextStep)
    this.increaseButton = this.createButton('Increase font size', 'A+', resizableTextStep)
    this.output = document.createElement('output')
    this.output.setAttribute('aria-live', 'polite')
    this.output.setAttribute('aria-label', 'Current font size')
    toolbar.append(this.decreaseButton, this.output, this.increaseButton)

    this.content = document.createElement('div')
    this.content.className = 'content'
    this.content.append(document.createElement('slot'))
    this.shadowRoot.replaceChildren(style, toolbar, this.content)
    this.shadowRoot.addEventListener('click', this.onClick)

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'group')
    }
    if (!this.hasAttribute('aria-label')) {
      this.setAttribute('aria-label', 'Resizable text controls')
    }

    this.loadSize()
    this.renderSize()
  }

  disconnectedCallback() {
    this.shadowRoot.removeEventListener('click', this.onClick)
  }

  attributeChangedCallback(name, oldValue, newValue) {
    if (name !== 'data-key' || oldValue === newValue || !this.isConnected) {
      return
    }

    this.loadSize()
    this.renderSize()
  }

  createButton(label, text, change) {
    const button = document.createElement('button')
    button.type = 'button'
    button.textContent = text
    button.setAttribute('aria-label', label)
    button.dataset.change = String(change)
    return button
  }

  onClick(event) {
    const button = event.target.closest('button[data-change]')
    if (!button || button.disabled) {
      return
    }

    this.size = Math.min(
      resizableTextMaximum,
      Math.max(resizableTextMinimum, this.size + Number(button.dataset.change)),
    )
    this.renderSize()
    this.saveSize()
  }

  getStorageKey() {
    return this.getAttribute('data-key') || 'mdcoachResizableTextGlobalSize'
  }

  loadSize() {
    const key = this.getStorageKey()
    try {
      const storedSize = Number(window.localStorage.getItem(key))
      this.size = Number.isFinite(storedSize) && storedSize >= resizableTextMinimum
        ? Math.min(storedSize, resizableTextMaximum)
        : resizableTextDefault
    } catch {
      this.size = resizableTextDefault
    }
  }

  saveSize() {
    const key = this.getStorageKey()
    try {
      window.localStorage.setItem(key, String(this.size))
    } catch {
      // Local storage may be unavailable in restricted browsing contexts.
    }
  }

  renderSize() {
    if (!this.content) {
      return
    }

    this.content.style.setProperty('--resizable-text-size', `${this.size}%`)
    this.output.textContent = `${this.size}%`
    this.decreaseButton.disabled = this.size <= resizableTextMinimum
    this.increaseButton.disabled = this.size >= resizableTextMaximum
  }
}
