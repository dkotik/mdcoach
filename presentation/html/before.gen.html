<style>
/* =============== layout.css ================= */

body {
  background-color: black;
  color: antiquewhite;
  padding: 1em;
  display: grid;
  align-items: center;
  vertical-align: middle;
  overflow: hidden !important;
}

main {
  margin: 0 auto;
  width: min(80%, 80em);
  max-height: 90%;
  position: relative;
}
/* =================== section.css =================== */

section {
  width: 100%;
  aspect-ratio: 4 / 3;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  border: 1px solid red;
  border-radius: 2em;
  transform-origin: 50% 0%;

  /* https://www.youtube.com/watch?v=KD3_l3S_D6M logic */
  position: absolute;
  z-index: -100;
  display: grid;
  visibility: hidden;
  opacity: 0;
  translate: 20vw 0;
  transition: visibility, opacity, translate, border-color;
  transition-duration: 900ms;
  transition-behavior: allow-discrete; /* animates display */
}

section.is-focused {
  visibility: visible;
  opacity: 1;
  translate: 0 0;
  border-color: black;
  z-index: 1;

  @starting-style {
    opacity: 0;
    translate: -20vw 0;
  }
}

section.reverse {
  translate: -20vw 0;
}

section.reverse.is-focused {
  translate: 0 0;
  border-color: black;

  @starting-style {
    translate: 20vw 0;
  }
}
/* =============== list_item.css ================= */

li {
  margin: 0.4em;
}

section > ul > li {
  position: relative; /* Establishes a bounding box for the overlay */
  overflow: hidden;    /* Optional: Prevents the color from bleeding past rounded corners */
}

section > ul > li::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-left: 0.7em solid #4527f4;
  background-color: #151754; /* Change to your desired covering color */
  z-index: 10;               /* Ensures the color sits on top of the content */
}

section > ul > li.is-revealed::after {
  display: none;
}
/* =============== image.css ================= */

.mdcoachImage {
	min-height: 1.5em;
	min-width: 1.5em;
	background-repeat: no-repeat;
	background-position: center center;
	background-size: contain;
	aspect-ratio: attr(data-aspect-ratio type(<number>));
}
</style><main>
