<style>
html {
  overscroll-behavior: none;
}

:root {
  --color-body-text: black;
  --color-body-subtext: #aaa;
  --color-body-background: white;
  --color-menu-background: #eee;
  --color-menu-text: #666;
  --color-button-background: #fff;

  /* Notes */
  /* #4527f4 */
  --color-marker-background: #006eff;
  --color-marker-trail: #003eaf;
}

html[data-theme="dark"] {
  --color-body-text: white;
  --color-body-subtext: #4a4a4a;
  --color-body-background: black;
  --color-menu-background: #161623;
  --color-menu-text: #333;
  --color-button-background: #999;

  /* Notes */
  --color-marker-background: #006eff;
  --color-marker-trail: #003eaf;
}
/* =============== layout.css ================= */

body {
  color: var(--color-body-text);
  background-color: var(--color-body-background);
  padding: 0;
  margin: 0;
  /*display: grid;
  align-items: center;
  vertical-align: middle;*/
  overflow: hidden !important;
}

aside.curtain {
  display: none;
  position: fixed;
  top: -0.3rem;
  left: 0;
  width: 100vw;
  height: 100vh;
  color: var(--color-body-subtext);
  font-weight: bold;
  font-size: 3rem;
  background-color: var(--color-body-background);
  z-index: 9999998;
  border-bottom: 0.2rem solid var(--color-marker-background);
  align-items: center;
  justify-content: center;
  vertical-align: middle;

  transition: visibility, opacity;
  transition-duration: 1900ms;
  transition-behavior: allow-discrete; /* animates display */
}

/*main {
  margin: 0 auto;
  width: min(80%, 80rem);
  max-height: 90%;
  position: relative;
}*/
/* =================== section.css =================== */

section {
  display: block;
  width: 100%;
  aspect-ratio: 4 / 3;
  border: 1px solid red;
  border-radius: 2rem;
  transform-origin: 50% 0%;

  /* https://www.youtube.com/watch?v=KD3_l3S_D6M logic */
  position: absolute;
  z-index: -100;
  /*display: grid;*/
  /*grid-template-columns: 1fr 1fr 1fr;*/
  /*grid-template-areas: "content content content";*/
  visibility: hidden;
  opacity: 0;
  translate: 20vw 0;
  transition: visibility, opacity, translate, border-color;
  transition-duration: 900ms;
  transition-behavior: allow-discrete; /* animates display */
}

section.is-focused {
  visibility: visible;
  opacity: 1;
  translate: 0 0;
  border-color: black;
  z-index: 1;

  @starting-style {
    opacity: 0;
    translate: -20vw 0;
  }
}

section.reverse {
  translate: -20vw 0;
}

section.reverse.is-focused {
  translate: 0 0;
  border-color: black;

  @starting-style {
    translate: 20vw 0;
  }
}

section > .grid {
  display: grid;
  align-items: center;
  justify-content: center;
  vertical-align: middle;
  width: 100%;
  height: 100%;
  padding: 1rem;
  box-sizing: border-box;
  /*border: 1px solid green;*/
}

section > .grid > .content {
  /* push the items up a bit */
  margin-bottom: 30%;
}

/* section layout */

section[data-layout="left-aside"] > .grid > .content {
  padding-left: 40vw;

  figure {
    position: fixed;
    margin: 0;
    top: 0;
    left: 0;
    /*border: 3px dashed red;*/
    width: 38vw;
    height: 100vh;
    box-sizing: border-box;
    overflow: hidden;

    .mdcoachImage {
      /*border: 3px dashed green;*/
      width: 100%;
      height: 100%;
      background-size: cover;
      box-sizing: border-box;
    }

    figcaption {
      position: absolute;
      bottom: 0;
      color: white;
      background-color: rgba(0.1, 0.1, 0.1, 0.3);
      background: linear-gradient(to top, black, rgba(0, 0, 0, 0)) no-repeat;
      padding: 20% 1rem 1rem 1rem;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
      /*text-align: right;*/
    }
  }
}

section[data-layout="right-aside"] > .grid > .content {
  padding-right: 40vw;

  figure {
    position: fixed;
    margin: 0;
    top: 0;
    right: 0;
    /*border: 3px dashed red;*/
    width: 38vw;
    height: 100vh;
    box-sizing: border-box;
    overflow: hidden;

    .mdcoachImage {
      /*border: 3px dashed green;*/
      width: 100%;
      height: 100%;
      background-size: cover;
      box-sizing: border-box;
    }

    figcaption {
      position: absolute;
      bottom: 0;
      color: white;
      background-color: rgba(0.1, 0.1, 0.1, 0.3);
      background: linear-gradient(to top, black, rgba(0, 0, 0, 0)) no-repeat;
      padding: 20% 1rem 1rem 1rem;
      margin: 0;
      width: 100%;
      box-sizing: border-box;
      text-align: right;
    }
  }
}

/* section scaling */

section > .grid > .content[data-scale="90"] {
  font-size: 90%;
}

section > .grid > .content[data-scale="80"] {
  font-size: 80%;
}

section > .grid > .content[data-scale="70"] {
  font-size: 70%;
}

section > .grid > .content[data-scale="60"] {
  font-size: 65%;
}

section > .grid > .content[data-scale="50"] {
  font-size: 60%;
}

section > .grid > .content[data-scale="40"] {
  font-size: 55%;
}

section > .grid > .content[data-scale="30"] {
  font-size: 50%;
}

section > .grid > .content[data-scale="20"] {
  font-size: 45%;
}

section > .grid > .content[data-scale="10"] {
  font-size: 40%;
}

section > .grid > .content[data-scale="60"] .mdcoachImage {
  max-width: 90%;
}

section > .grid > .content[data-scale="50"] .mdcoachImage {
  max-width: 80%;
}

section > .grid > .content[data-scale="40"] .mdcoachImage {
  max-width: 70%;
}

section > .grid > .content[data-scale="30"] .mdcoachImage {
  max-width: 50%;
  max-height: 20vh;
}

section > .grid > .content[data-scale="20"] .mdcoachImage {
  float: right;
  margin-left: 1rem;
  max-width: 30%;
  max-height: 15vh;
}

section > .grid > .content[data-scale="10"] .mdcoachImage {
  float: right;
  margin-left: 1rem;
  max-width: 5em;
  max-height: 5em;
}
/* =============== list_item.css ================= */

.content li {
  margin: 0.4rem;
}

.content > ul > li {
  position: relative; /* Establishes a bounding box for the overlay */
  overflow: hidden;    /* Optional: Prevents the color from bleeding past rounded corners */
}

.content > ul > li::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-left: 0.7rem solid var(--color-marker-background);
  background-color: var(--color-marker-trail); /* Change to your desired covering color */
  z-index: 10;               /* Ensures the color sits on top of the content */
}

.content > ul > li.is-revealed::after {
  display: none;
}
/* =============== image.css ================= */

.mdcoachImage {
	min-height: 1.5rem;
	min-width: 1.5rem;
	background-repeat: no-repeat;
	background-position: center center;
	background-size: contain;
	aspect-ratio: attr(data-aspect-ratio type(<number>));
}
.content > blockquote {
  padding: 1.5rem 2rem;
  border-left: 0.5rem solid var(--color-marker-background);
  background-color: var(--color-menu-background);
  /*background-color: var(--color-alt);*/
  padding: 1rem 1rem 1rem 4rem;
  margin: 1rem 1.5rem 1rem 3rem;
  margin: 0;
}

.content > blockquote > p+cite {
  display: block;
  font-family: sans-serif;
  margin-right: 2rem;
  margin-bottom: -1rem;
  margin-top: 0.8rem;
  text-align: right;
  font-size: 80%;
  color: var(--color-body-subtext);
}

.content > blockquote > p+cite:before {
  color: var(--color-body-subtext);
  content: "\2013\00A0";
}
.content pre, code {
  white-space: pre-wrap;       /* Preserves whitespace and wraps naturally */
  overflow-wrap: break-word;

  background-color: var(--color-alt);
  padding: 1rem 1rem 1rem 4rem;
  margin: 1rem 1.5rem 1rem 3rem;
}
</style><main>
