<body class="is-focused slides">
  <presentation-menu>
    <fullscreen-toggle class="icon" title="Fullscreen">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" aria-hidden="true" focusable="false">
        <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
      </svg>
    </fullscreen-toggle>
    <dark-light-toggle class="icon" title="Fullscreen">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M8 256c0 136.966 111.033 248 248 248s248-111.034 248-248S392.966 8 256 8 8 119.033 8 256zm248 184V72c101.705 0 184 82.311 184 184 0 101.705-82.311 184-184 184z"/></svg>
    </dark-light-toggle>
    <slideview-toggle class="icon" title="Slide view">
      <svg class="icon" viewBox="0 0 1792 1792" xmlns="http://www.w3.org/2000/svg"><path d="M448 1536h896v-256h-896v256zm0-640h896v-384h-160q-40 0-68-28t-28-68v-160h-640v640zm1152 64q0-26-19-45t-45-19-45 19-19 45 19 45 45 19 45-19 19-45zm128 0v416q0 13-9.5 22.5t-22.5 9.5h-224v160q0 40-28 68t-68 28h-960q-40 0-68-28t-28-68v-160h-224q-13 0-22.5-9.5t-9.5-22.5v-416q0-79 56.5-135.5t135.5-56.5h64v-544q0-40 28-68t68-28h672q40 0 88 20t76 48l152 152q28 28 48 76t20 88v256h64q79 0 135.5 56.5t56.5 135.5z"/></svg>
    </slideview-toggle>
    <curtain-toggle class="icon" title="Presentation curtain">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2" />
        <path d="M9 9v6M15 9v6" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
      </svg>
    </curtain-toggle>
    <presentation-play></presentation-play>
  </presentation-menu>
  <presentation-side-button side="left" onclick="previous(event)">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true" focusable="false">
      <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" />
    </svg>
  </presentation-side-button>
  <presentation-side-button side="right" onclick="next(event)">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true" focusable="false">
      <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" />
    </svg>
  </presentation-side-button>
  <presentation-curtain></presentation-curtain>

<presentation-timer id="mainTimer" style="max-width: 2rem; max-height: 2rem; position: fixed; bottom: 1rem; right: 1rem;z-index: 77;" duration="333"></presentation-timer>
<mouse-proximity style="position: fixed; bottom: 1rem; right: 4rem; z-index: 77;" distance="120">
  <timer-set duration="60" data-timer-id="mainTimer"></timer-set>
</mouse-proximity>
<keystroke-combo id="slideJump" filter="^\d+"></keystroke-combo>
<presentation-progress></presentation-progress>
