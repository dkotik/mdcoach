<body>
  <presentation-menu>
    <fullscreen-toggle class="icon">
      Fullscreen
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" aria-hidden="true" focusable="false">
        <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
      </svg>
    </fullscreen-toggle>
    <dark-light-toggle>
      Dark
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M8 256c0 136.966 111.033 248 248 248s248-111.034 248-248S392.966 8 256 8 8 119.033 8 256zm248 184V72c101.705 0 184 82.311 184 184 0 101.705-82.311 184-184 184z"/></svg>
    </dark-light-toggle>
  </presentation-menu>
  <presentation-side-button side="left" onclick="previous(event)">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true" focusable="false">
      <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" />
    </svg>
  </presentation-side-button>
  <presentation-side-button side="right" onclick="next(event)">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" aria-hidden="true" focusable="false">
      <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" />
    </svg>
  </presentation-side-button>
  <aside class="curtain">⏸</aside>

<presentation-timer style="max-width: 2rem; max-height: 2rem; position: fixed; top: 1rem; left: 1rem;z-index: 777;"></presentation-timer>
<keystroke-combo id="slideJump" filter="^\d+"></keystroke-combo>
<presentation-progress></presentation-progress>
