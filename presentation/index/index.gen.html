<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Presentations</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        --index-background: #111;
        --index-text: #eee;
        --index-muted: #aaa;
        --index-link: #8ab4f8;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --index-background: #fff;
        --index-text: #222;
        --index-muted: #666;
        --index-link: #1558b0;
      }
      body {
        background: var(--index-background);
        color: var(--index-text);
        margin: 2rem auto;
        max-width: 40rem;
        padding: 0 1rem;
      }
      .index-header {
        align-items: center;
        display: flex;
        justify-content: space-between;
      }
      .index-header h1 {
        margin: 0;
      }
      dark-light-toggle {
        color: inherit;
        font-size: 1.5rem;
      }
      dark-light-toggle:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 3px;
      }
      dark-light-toggle svg {
        height: 1em;
        width: 1em;
      }
      #presentations {
        list-style: none;
        padding: 0;
      }
      #presentations > li {
        margin: 1.5rem 0;
      }
      #presentations a {
        display: inline-block;
        color: var(--index-link);
        text-decoration: none;
        border-bottom: 1px dotted lightblue;
        padding-bottom: 0.2rem;
        margin-bottom: 0.6rem;
        font-size: 1.35rem;
        font-weight: 600;
      }
      #presentations small {
        color: var(--index-muted);
        display: block;
      }
      #presentations p {
        margin: 0.25rem 0 0;
      }
    </style>
  </head>
  <body>
    <script>
      // use as custom element <dark-light-toggle> around document-provided content

class DarkLightToggle extends HTMLElement {
  constructor() {
    super()
    this.attachShadow({ mode: 'open' })
    this.onClick = this.onClick.bind(this)
    this.onKeyDown = this.onKeyDown.bind(this)
  }

  connectedCallback() {
    try {
      this.darkMode = window.localStorage.getItem('darkMode') !== 'false'
    } catch {
      this.darkMode = true
    }
    this.applyTheme()

    const style = document.createElement('style')
    style.textContent = `
      :host {
        align-items: center;
        cursor: pointer;
        display: inline-flex;
      }

      ::slotted(svg) {
        fill: currentColor;
        height: 1em;
        margin-inline-start: 0.4em;
        width: 1em;
      }

      :host(:focus-visible) {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
    `

    this.shadowRoot.replaceChildren(style, document.createElement('slot'))

    if (!this.hasAttribute('role')) {
      this.setAttribute('role', 'button')
    }
    if (!this.hasAttribute('tabindex')) {
      this.setAttribute('tabindex', '0')
    }

    this.addEventListener('click', this.onClick)
    this.addEventListener('keydown', this.onKeyDown)
    this.updatePressedState()
  }

  disconnectedCallback() {
    this.removeEventListener('click', this.onClick)
    this.removeEventListener('keydown', this.onKeyDown)
  }

  applyTheme() {
    document.documentElement.dataset.theme = this.darkMode ? 'dark' : 'light'
  }

  updatePressedState() {
    this.setAttribute('aria-pressed', String(this.darkMode))
  }

  onClick() {
    this.toggle()
  }

  onKeyDown(event) {
    if (event.code !== 'Enter' && event.code !== 'Space') {
      return
    }

    event.preventDefault()
    this.toggle()
  }

  toggle() {
    this.darkMode = !this.darkMode
    try {
      window.localStorage.setItem('darkMode', String(this.darkMode))
    } catch {
      // Local storage may be unavailable in restricted browsing contexts.
    }
    this.applyTheme()
    this.updatePressedState()
  }
}

if (!customElements.get('dark-light-toggle')) {
  customElements.define('dark-light-toggle', DarkLightToggle)
}

    </script>
    <header class="index-header">
    </header>
    <dark-light-toggle aria-label="Toggle color theme" title="Toggle color theme" style="float: right; margin: 1rem;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
        <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
      </svg>
    </dark-light-toggle>
    <ul id="presentations">
    </ul>
  </body>
</html>
