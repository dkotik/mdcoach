<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>v2 Proof of Concept</title>
  </head>
  <style>
    body {
      background-color: black;
      color: antiquewhite;
      padding: 4em;

      overflow: hidden !important;
    }

    section {
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      width: min(80%, 80em);
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      border: 1px solid red;

      /* https://www.youtube.com/watch?v=KD3_l3S_D6M logic */
      position: fixed;
      z-index: -100;
      display: none;
      opacity: 0;
      translate: -20vw 0;
      transition: display, opacity, translate;
      transition-duration: 2000ms;
      transition-behavior: allow-discrete; /* animates display */
    }

    section:target {
      display: grid;
      opacity: 1;
      translate: 0 0;

      @starting-style {
        opacity: 0;
        translate: 20vw 0;
      }
    }
  </style>
  <script>
    let slide = 1;
    setInterval(() => {
      slide = slide + ((Math.random() > 0.5) ? 1:-1)
      if (slide < 1) slide = 3;
      if (slide > 5) slide = 5;
      window.location.hash = `${slide}`;
    }, 4000);
  </script>
  <body>
    <main>
      <section id="1">1 - not on Firefox</section>
      <section id="2">2 - not on Firefox</section>
      <section id="3">3 - not on Firefox</section>
      <section id="4">4 - not on Firefox</section>
      <section id="5">5 - not on Firefox</section>
      <section id="6">6 - not on Firefox</section>
    </main>
  </body>
</html>
